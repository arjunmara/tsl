# Nightly copy of the database into the repo (seasons/db.json + the text files the graphics read).
# Also counts as activity, so the free Supabase project doesn't pause between seasons.
name: Nightly backup
on:
  schedule: [{ cron: '30 18 * * *' }]  # 00:15 in Nepal
  workflow_dispatch:                   # "Run workflow" button in the Actions tab
permissions: { contents: write }
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 sync.py
      - run: |
          git config user.name 'TSL backup'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add seasons/db.json matchday/*.txt matchday/*.json teamlist/squads.txt
          if ! git diff --cached --quiet; then git commit -m "Backup $(date -u +%F)" && git push; fi
