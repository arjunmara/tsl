name: Release gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (layer rule)
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Scaffold checks (layer rule, build guard)
        run: npm run check
      - name: Accessibility check
        run: npm run check:a11y
      - name: Component check
        run: npm run check:ui
      - name: Auth check
        run: npm run check:auth
      - name: Offline replay test (Story 1.7)
        run: npm run check:outbox
      - name: Setup wizard check (Story 1.8)
        run: npm run check:setup
      - name: BS/AD date formatter test (Story 1.9)
        run: npm run check:dates
      - name: Tournament home and Settings check (Story 1.12)
        run: npm run check:home
      - name: Sponsors check (Story 1.13)
        run: npm run check:sponsors
      - name: Co-organisers check (Story 1.14)
        run: npm run check:organisers
      - name: Teams check (Story 2.1)
        run: npm run check:teams
      - name: Registration link check (Story 2.2)
        run: npm run check:register
      - name: Players and Staff check (Story 2.3)
        run: npm run check:squad
      - name: Eligibility proof check (Story 2.4)
        run: npm run check:eligibility
      - name: Photos, background removal and no-AGPL check (Story 2.5)
        run: npm run check:photos
      - name: Organiser enters a Team from a paper sheet (Story 2.6)
        run: npm run check:paper
      - name: Organiser views a scan and marks Eligibility verified (Story 2.7)
        run: npm run check:verify
      - name: Organiser approves, returns or withdraws a Team (Story 2.8)
        run: npm run check:review
      - name: Links close at the deadline; reopen one for a reason (Story 2.9)
        run: npm run check:deadline
      - name: Delete a Player's photo and personal details on request (Story 2.10)
        run: npm run check:erase
      - name: Record the live chit Draw (Story 3.1)
        run: npm run check:draw
      - name: Suggested fixtures and the knockout path (Story 3.2)
        run: npm run check:fixtures
      - name: Arrange, schedule and publish Fixtures (Story 3.3)
        run: npm run check:arrange
      # One Postgres run covers the migration check and Story 1.6's leak tests (cross-tenant read
      # and write, Activity log, idempotency), the co-organiser and Team leak and race tests (Stories 1.14, 2.1) and the pg_proc
      # command skeleton check, and the standings parity check against matchday/league.js (Story 3.4).
      - name: Migration, leak tests and command skeleton check (Stories 1.4, 1.6)
        working-directory: .
        run: bash supabase/migrations/check.sh
      - name: Public-data guard
        working-directory: .
        # sync.py writes into the public repo; it must never read the app schema.
        run: |
          [ -f sync.py ] || { echo "::error::sync.py is missing"; exit 1; }
          if grep -qiE 'Accept-Profile|Content-Profile' sync.py; then
            echo "::error::sync.py sets a schema profile header (reads a non-public schema)"; exit 1
          fi
      - name: Standings and knockout progression (Story 3.4)
        run: npm run check:standings
      - name: Start the tournament (Story 3.5)
        run: npm run check:start
      - name: Confirm before changes after start (Story 3.6)
        run: npm run check:confirm
      - name: Browse the Activity log (Story 3.7)
        run: npm run check:activity
      - name: Finish the Season (Story 3.8)
        run: npm run check:finish
      - name: Scorer link with number-matching approval (Story 4.1)
        run: npm run check:scorer
      - name: Pre-match line-ups, kit colours and On-air Match (Story 4.2)
        run: npm run check:console
      - name: One Match clock and periods (Story 4.3)
        run: npm run check:clock
      - name: Record goals with an 8-second Undo (Story 4.4)
        run: npm run check:goals
      - name: Cards, fouls, substitutions, timeouts and power play (Story 4.5)
        run: npm run check:events
      - name: End the match, Awards, shootout and typed results (Story 4.6)
        run: npm run check:result
