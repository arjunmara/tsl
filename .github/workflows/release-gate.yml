name: Release gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (layer rule)
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Scaffold checks (layer rule, build guard)
        run: npm run check
      - name: Accessibility check
        run: npm run check:a11y
      - name: Component check
        run: npm run check:ui
      - name: Auth check
        run: npm run check:auth
      - name: Offline replay test (Story 1.7)
        run: npm run check:outbox
      - name: Setup wizard check (Story 1.8)
        run: npm run check:setup
      - name: BS/AD date formatter test (Story 1.9)
        run: npm run check:dates
      - name: Tournament home and Settings check (Story 1.12)
        run: npm run check:home
      - name: Sponsors check (Story 1.13)
        run: npm run check:sponsors
      - name: Co-organisers check (Story 1.14)
        run: npm run check:organisers
      # One Postgres run covers the migration check and Story 1.6's leak tests (cross-tenant read
      # and write, Activity log, idempotency), the co-organiser leak and race tests (Story 1.14) and the pg_proc
      # command skeleton check.
      - name: Migration, leak tests and command skeleton check (Stories 1.4, 1.6)
        working-directory: .
        run: bash supabase/migrations/check.sh
      - name: Public-data guard
        working-directory: .
        # sync.py writes into the public repo; it must never read the app schema.
        run: |
          [ -f sync.py ] || { echo "::error::sync.py is missing"; exit 1; }
          if grep -qiE 'Accept-Profile|Content-Profile' sync.py; then
            echo "::error::sync.py sets a schema profile header (reads a non-public schema)"; exit 1
          fi
      # Slots filled by later stories; each stays a passing no-op until then.
      - name: Standings test (Story 3.4)
        run: echo "not yet implemented"
