<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TSL Reel Card</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* Vertical 1080x1920 cards for the highlights reel. ?mode=intro|outro&title=...&date=...&sub=... */
  :root { --navy: #0a1a3f; --navy-2: #12285c; --orange: #f58220; --muted: #9fb0d6; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body { font-family: 'Barlow', sans-serif; color: #fff; text-align: center; position: relative;
    background: radial-gradient(900px 700px at 50% 20%, rgba(245,130,32,.2), transparent 60%), linear-gradient(180deg, var(--navy-2), var(--navy) 60%); }
  .bg { position: absolute; inset: 0; }
  .stripe { position: absolute; left: 0; right: 0; height: 14px; background: var(--orange); }
  .wrap { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; }
  .logo { width: 420px; height: 420px; border-radius: 50%; background: #fff; padding: 5px; box-shadow: 0 0 0 10px var(--orange), 0 30px 80px rgba(0,0,0,.5); }
  .logo img { width: 100%; height: 100%; border-radius: 50%; display: block; }
  .kicker { margin-top: 30px; font-weight: 700; font-size: 34px; letter-spacing: 14px; color: var(--orange); }
  h1 { font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 200px; line-height: .9; letter-spacing: 4px; }
  .date { font-family: 'Bebas Neue', sans-serif; font-size: 150px; line-height: .9; letter-spacing: 6px; color: var(--orange); }
  .date:empty { display: none; }
  .sub { font-weight: 600; font-size: 34px; letter-spacing: 10px; color: var(--muted); text-transform: uppercase; }
</style>
</head>
<body>
  <svg class="bg" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="fade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".6" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
    <g id="swoosh" fill="none" stroke="url(#fade)"></g>
  </svg>
  <div class="stripe" style="top:0"></div><div class="stripe" style="bottom:0"></div>
  <div class="wrap">
    <div class="logo"><img src="../logo.jpg" alt=""></div>
    <div class="kicker">TAMGHAS SUPER LEAGUE</div>
    <h1 id="title"></h1>
    <div class="date" id="date"></div>
    <div class="sub" id="sub"></div>
  </div>
<script>
  // Same swooshes as the other TSL graphics, stretched to 9:16.
  for (let i = 0; i < 24; i++) {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'), o = i * 30;
    p.setAttribute('d', `M${-200 + o},1920 C${150 + o},${1300 - o} ${500 + o},${700 - o * .6} 1300,${-50 + o * 2}`);
    p.setAttribute('stroke-width', i % 4 ? 1 : 2);
    document.getElementById('swoosh').append(p);
  }
  const q = new URLSearchParams(location.search), outro = q.get('mode') === 'outro';
  document.getElementById('title').innerHTML = (q.get('title') || (outro ? 'See you<br>next match' : 'Highlights')).replace(/</g, '&lt;').replace(/&lt;br>/g, '<br>');
  document.getElementById('date').textContent = q.get('date') || '';
  document.getElementById('sub').textContent = q.get('sub') || (outro ? 'Follow for more · Tamghas, Gulmi' : 'Futsal · Tamghas, Gulmi');
</script>
</body>
</html>
