<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TSL Team Reveal</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@600;700&display=swap" rel="stylesheet">
<script src="../matchday/league.js"></script>
<style>
  /* Vertical 1080x1920 frames for the team reveal reel. ?mode=hook | team&i=0..12 | grid | outro */
  :root { --navy: #0a1a3f; --navy-2: #12285c; --orange: #f58220; --muted: #9fb0d6; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body { font-family: 'Barlow', sans-serif; color: #fff; text-align: center; position: relative;
    background: radial-gradient(900px 800px at 50% 45%, rgba(245,130,32,.22), transparent 60%), linear-gradient(180deg, var(--navy-2), var(--navy) 60%); }
  .bg { position: absolute; inset: 0; }
  .stripe { position: absolute; left: 0; right: 0; height: 14px; background: var(--orange); }
  .wrap { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 60px; }
  .bebas { font-family: 'Bebas Neue', sans-serif; font-weight: 400; line-height: .9; letter-spacing: 4px; }
  .logo { width: 150px; height: 150px; border-radius: 50%; background: #fff; padding: 3px; box-shadow: 0 0 0 6px var(--orange), 0 16px 40px rgba(0,0,0,.45); }
  .logo img { width: 100%; height: 100%; border-radius: 50%; display: block; }
  .kicker { font-weight: 700; font-size: 30px; letter-spacing: 12px; color: var(--orange); text-transform: uppercase; }
  .muted { font-weight: 600; font-size: 32px; letter-spacing: 10px; color: var(--muted); text-transform: uppercase; }
  .crest { border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none;
    background: radial-gradient(circle at 50% 30%, #1d3a7c, var(--navy));
    box-shadow: 0 0 0 calc(var(--s) * .035) var(--orange), 0 30px 80px rgba(0,0,0,.5);
    width: var(--s); height: var(--s); font-family: 'Bebas Neue', sans-serif; line-height: 1; letter-spacing: 3px; }
  footer { position: absolute; bottom: 70px; left: 0; right: 0; }
  .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 46px 40px; width: 940px; margin-top: 70px; }
  .grid .cell { width: 200px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .grid .cell span { font-weight: 700; font-size: 20px; letter-spacing: 2px; line-height: 1.2; text-transform: uppercase; text-wrap: balance; }
</style>
</head>
<body>
  <svg class="bg" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="fade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".6" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
    <g id="swoosh" fill="none" stroke="url(#fade)"></g>
  </svg>
  <div class="stripe" style="top:0"></div><div class="stripe" style="bottom:0"></div>
  <div class="wrap" id="main"></div>
  <footer class="muted" style="font-size:24px"><b style="color:var(--orange)">TSL</b> &nbsp;·&nbsp; TAMGHAS, GULMI</footer>
<script>
  for (let i = 0; i < 24; i++) {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'), o = i * 30;
    p.setAttribute('d', `M${-200 + o},1920 C${150 + o},${1300 - o} ${500 + o},${700 - o * .6} 1300,${-50 + o * 2}`);
    p.setAttribute('stroke-width', i % 4 ? 1 : 2);
    document.getElementById('swoosh').append(p);
  }
  // Captains from the team lists. Cocktails Youth Club hasn't named one yet.
  const CAPTAINS = {
    JBT: 'Rilesh Shrees', RE8: 'Vijay Bhujel', DFT: 'Abishkar Khatri', FSW: 'Hari Kunwar', BW3: 'Arjun KC',
    RTM: 'Prakash GC', KPT: 'Rhythm Basnet', KYC: 'Pawan Raut', '14SYC': 'Bisho Basnet', DAB: 'Mishan KC',
    PTB: 'Parbesh KC', NYC: 'Deepak Mukhiya',
  };
  const ts = [...TEAMS].sort((a, b) => a.name.localeCompare(b.name));
  const crest = (t, s) => `<div class="crest" style="--s:${s}px;font-size:${s * .38 * Math.min(1, 3.4 / t.code.length)}px">${t.code}</div>`;
  const logo = '<div class="logo"><img src="../logo.jpg" alt=""></div>';
  const q = new URLSearchParams(location.search), mode = q.get('mode') || 'hook';
  const main = document.getElementById('main');

  if (mode === 'hook') main.innerHTML = `
    <div class="logo" style="width:300px;height:300px">${'<img src="../logo.jpg" alt="">'}</div>
    <div class="kicker" style="margin-top:60px">Tamghas Super League</div>
    <div class="bebas" style="font-size:300px;margin-top:30px">${ts.length} Teams</div>
    <div class="bebas" style="font-size:200px;color:var(--orange)">1 Trophy</div>`;
  if (mode === 'team') {
    const i = +q.get('i'), t = ts[i], cap = CAPTAINS[t.code];
    // Fixed layout so the crest doesn't jump between one- and two-line names in the fast cuts.
    main.style.justifyContent = 'flex-start';
    main.style.paddingTop = '230px';
    main.innerHTML = `
      ${logo}
      <div class="kicker" style="margin-top:50px">Team ${String(i + 1).padStart(2, '0')} / ${ts.length}</div>
      <div style="margin-top:70px">${crest(t, 460)}</div>
      <div style="height:330px;margin-top:80px;display:flex;align-items:center"><div class="bebas" id="name" style="font-size:170px;text-wrap:balance;max-width:960px">${t.name}</div></div>
      ${cap ? `<div class="muted" style="margin-top:40px">Captain</div><div style="font-weight:700;font-size:52px;letter-spacing:4px;margin-top:12px;text-transform:uppercase">${cap}</div>` : ''}`;
  }
  if (mode === 'grid') main.innerHTML = `
    <div class="kicker">Tamghas Super League</div>
    <div class="bebas" style="font-size:170px;margin-top:20px">The Contenders</div>
    <div class="grid">${ts.map(t => `<div class="cell">${crest(t, 150)}<span>${t.name}</span></div>`).join('')}</div>`;
  if (mode === 'outro') main.innerHTML = `
    <div class="logo" style="width:300px;height:300px"><img src="../logo.jpg" alt=""></div>
    <div class="kicker" style="margin-top:60px">Tamghas Super League</div>
    <div class="bebas" style="font-size:210px;margin-top:30px">Who takes<br><span style="color:var(--orange)">the crown?</span></div>
    <div class="muted" style="margin-top:50px">Kick-off soon · Follow for more</div>`;

  // Long names: shrink until they fit on at most two lines.
  document.fonts.ready.then(() => {
    const n = document.getElementById('name');
    if (n) for (let s = 170; n.offsetHeight > 2 * s * .95 && s > 90; s -= 5) n.style.fontSize = `${s - 5}px`;
  });
</script>
</body>
</html>
