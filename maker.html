<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TSL Graphics</title>
<link rel="apple-touch-icon" href="logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Phone graphics maker: no laptop needed. Templates render in an iframe; the PNG is made in the browser.
     Shared data lives in Firebase (see startSync); localStorage is this phone's copy. */
  :root { --navy: #0a1a3f; --navy-2: #12285c; --card: #102352; --orange: #f58220; --muted: #9fb0d6; --line: rgba(255,255,255,.1);
          --ok: #3ddc84; --bad: #ff6b6b; --tabs: 64px; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--navy); color: #fff; font-family: 'Barlow', sans-serif; padding-bottom: calc(var(--tabs) + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top));
    background: var(--navy-2); border-bottom: 3px solid var(--orange); position: sticky; top: 0; z-index: 5; }
  header img { width: 36px; height: 36px; border-radius: 50%; box-shadow: 0 0 0 2px var(--orange); }
  header h1 { margin: 0; font: 400 26px 'Bebas Neue', sans-serif; letter-spacing: 2px; }
  #sync { margin-left: auto; padding: 6px 12px 6px 10px; font-size: 13px; border-radius: 99px; display: flex; align-items: center; gap: 6px; }
  #sync::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  #sync.ok::before { background: var(--ok); } #sync.bad { color: var(--bad); } #sync.bad::before { background: var(--bad); }
  main { max-width: 1100px; margin: 0 auto; padding: 14px 16px 24px; }
  h2 { margin: 0 0 10px; font: 400 26px 'Bebas Neue', sans-serif; letter-spacing: 2px; }
  h3 { margin: 16px 0 6px; font-size: 12px; font-weight: 700; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  button, .btn { font: inherit; font-weight: 700; color: #fff; background: var(--navy-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 14px; min-height: 44px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  button:active, .btn:active { transform: scale(.97); }
  .on, .primary { background: var(--orange); color: var(--navy); border-color: var(--orange); }
  .wide { width: 100%; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; } .actions > * { flex: 1; }
  label { display: block; margin-bottom: 12px; font-size: 12px; font-weight: 700; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; }
  input, select, textarea { width: 100%; margin-top: 5px; min-height: 44px; font: 500 16px 'Barlow', sans-serif; color: #fff; background: var(--navy);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--orange); outline-offset: -1px; }
  textarea { min-height: 120px; }
  details { margin-top: 10px; } summary { cursor: pointer; padding: 10px 0; font-weight: 700; color: var(--muted); }

  /* Graphic picker: grouped chips */
  .kinds { display: flex; flex-wrap: wrap; gap: 6px; }
  .kinds button { padding: 8px 12px; min-height: 40px; font-size: 14px; border-radius: 99px; }
  .cols { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; align-items: start; }
  @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
  .preview { position: relative; overflow: hidden; border-radius: 10px; background: var(--navy-2); }
  .preview iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; pointer-events: none; }
  .savebar { position: sticky; bottom: calc(var(--tabs) + env(safe-area-inset-bottom) + 8px); z-index: 4; margin-top: 10px; }
  .savebar button { width: 100%; font-size: 18px; min-height: 52px; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
  #png:not(:empty) { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 4px; }
  #png img { width: 100%; border-radius: 10px; display: block; margin-top: 10px; }

  .row3 { display: grid; grid-template-columns: 1fr 84px 1fr; gap: 8px; align-items: end; }
  .msg { margin-top: 8px; font-weight: 700; color: var(--muted); }
  .msg:empty { display: none; }
  .err { color: var(--bad); }
  .rrow { display: flex; gap: 6px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .rrow:last-child { border-bottom: 0; }
  .rrow button { padding: 6px 10px; min-height: 38px; } .rrow select, .rrow input { width: auto; margin: 0; padding: 8px 6px; min-height: 38px; }
  .tag { font-size: 12px; font-weight: 700; letter-spacing: 1px; padding: 2px 6px; border-radius: 5px; background: var(--orange); color: var(--navy); }
  .danger { color: var(--bad); }
  .sbox { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .sbox .sname { flex: 1; font-weight: 700; color: #fff; font-size: 17px; text-transform: none; letter-spacing: 0; }
  .sbox input { width: 70px; margin: 0; text-align: center; font-size: 24px; font-weight: 700; padding: 8px 4px; }
  .sbox button { width: 52px; padding: 8px 0; font-size: 24px; line-height: 1; }

  /* Bottom tab bar */
  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; background: var(--navy-2); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; flex-direction: column; gap: 2px; height: var(--tabs); border: 0; border-radius: 0; background: none; color: var(--muted); font-size: 12px; }
  nav button b { font-size: 20px; line-height: 1; }
  nav button.on { color: var(--orange); background: none; box-shadow: inset 0 3px 0 var(--orange); }
</style>
</head>
<body>
<header><img src="logo.jpg" alt=""><h1>TSL Graphics</h1><button id="sync">This phone only</button></header>
<dialog id="login" style="background:var(--card);color:#fff;border:1px solid var(--line);border-radius:14px;width:min(340px,90vw)">
  <form method="dialog" id="loginform">
    <h2>Organiser sign-in</h2>
    <label>Email<input name="email" type="email" autocomplete="username" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <div class="msg err" id="loginmsg"></div>
    <div class="actions"><button value="cancel" formnovalidate>Cancel</button><button class="primary" value="ok">Sign in</button></div>
  </form>
</dialog>
<main>
  <section data-tab="make">
    <div class="card" id="kinds"></div>
    <div class="cols">
      <form class="card" id="form" onsubmit="return false"><div id="fields"></div></form>
      <div class="card">
        <div class="preview" id="preview"><iframe id="frame"></iframe></div>
        <div class="msg" id="msg"></div>
        <div id="png"></div>
      </div>
    </div>
    <div class="savebar"><button class="primary" id="save">Save image</button></div>
  </section>

  <section data-tab="results" hidden>
    <div class="card">
      <h2>Add a result</h2>
      <label>Match<select id="rm"></select></label>
      <div class="cols" style="gap:8px;grid-template-columns:1fr 1fr">
        <label>Home<select id="rh"></select></label>
        <label>Away<select id="ra"></select></label>
      </div>
      <div id="rbox"></div>
      <label style="display:flex;gap:10px;align-items:center;text-transform:none;letter-spacing:0;font-size:15px;margin-top:6px">
        <input type="checkbox" id="rp" style="width:22px;min-height:22px;margin:0"> Penalty shootout score (add the draw first)</label>
      <div class="actions"><button id="rcancel" hidden>Cancel</button><button class="primary" id="radd">Add result</button></div>
      <div class="msg" id="rmsg"></div>
      <textarea id="results" hidden></textarea>
    </div>
    <div class="card">
      <h2>Results</h2>
      <div id="rlist"></div>
      <button id="rtable" class="wide" style="margin-top:10px">📊 Make points table graphic</button>
    </div>
  </section>

  <section data-tab="fixtures" hidden>
    <div class="card">
      <h2 id="fhead">Add a fixture</h2>
      <div class="row3">
        <label>Home<select id="fh"></select></label>
        <label>Round<select id="fg"></select></label>
        <label>Away<select id="fa"></select></label>
      </div>
      <label>Kick-off (optional)<input id="ft" type="time"></label>
      <div class="actions"><button id="fcancel" hidden>Cancel</button><button class="primary" id="fadd">Add fixture</button></div>
      <div class="msg" id="fmsg"></div>
    </div>
    <div class="card"><h2>Fixtures</h2><div id="flist"></div></div>
  </section>

  <section data-tab="groups" hidden>
    <div class="card">
      <h2>Groups</h2>
      <div class="msg" style="margin-top:0">Move a team with its dropdown.</div>
      <div id="grlist"></div>
      <div class="msg" id="grmsg"></div>
    </div>
  </section>
</main>
<nav>
  <button data-go="make" class="on"><b>🎨</b>Graphics</button>
  <button data-go="results"><b>📋</b>Results</button>
  <button data-go="fixtures"><b>📅</b>Fixtures</button>
  <button data-go="groups"><b>👥</b>Groups</button>
</nav>

<script src="matchday/league.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  const $ = id => document.getElementById(id);
  // FIREBASE comes from firebase-config.js.
  // results, goals and squads are shared through Firebase when signed in; localStorage is the offline copy.
  const SHARED = ['results', 'goals', 'events', 'squads', 'fixtures', 'groups'], sync = { db: null, user: null };
  const local = { get: k => { try { return localStorage.getItem(k); } catch { return null; } },
                  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
  // Shared keys only go up once this phone has the live data: a phone with an empty/stale copy used to overwrite everyone's.
  // Every upload is also kept in tsl/history, so a bad write can be rolled back.
  const store = { get: local.get, set: (k, v) => { local.set(k, v); if (sync.user && sync.ready && SHARED.includes(k)) {
    sync.db.child(k).set(v); sync.db.child('history').push({ k, v, at: firebase.database.ServerValue.TIMESTAMP, by: sync.user.email });
  } } };
  const text = f => fetch(`${f}?t=${Date.now()}`).then(r => r.ok ? r.text() : '');

  // Fields per graphic. Markers: * required, ~ textarea, @ team dropdown, # player dropdown (from the match's two teams),
  // ^ dropdown from OPTS, |default. "pick" is the match picker: it fills teams/time/score and isn't sent to the template.
  const MD = 'matchday/matchday.html', W = 1080, H = 1350;
  const KINDS = {
    goal:      ['Goal',        MD, ['pick', 'scorer#*', 'minute', 'team@*', 'home@*', 'away@*', 'score*']],
    score:     ['Final score', MD, ['pick', 'label^|Full Time', 'home@*', 'away@*', 'score*', 'homeScorers=', 'awayScorers=', 'homeCards=', 'awayCards=', 'match']],
    event:     ['Key event',   MD, ['pick', 'event^|Yellow Card', 'name#*', 'minute', 'team@*', 'home@*', 'away@*', 'score']],
    fixture:   ['Next match',  MD, ['pick', 'label^|Next Match', 'home@*', 'away@*', 'match', 'date|Saturday · Kartik 14', 'time', 'venue|Tamghas Futsal']],
    table:     ['Points table', MD, ['title|Points Table', 'subtitle', 'qualify|2', 'next|Quarter-Finals']],
    results:   ['Results',     MD, ['matches~*', 'title|Results', 'subtitle']],
    motm:      ['Man of match', MD, ['pick', 'name#*', 'team@*', 'stat', 'match']],
    scorers:   ['Top scorers', MD, ['players~*', 'title|Top Scorers', 'subtitle']],
    bracket:   ['Road to final', MD, ['qf~', 'sf~', 'final~', 'title|Road to the Final', 'subtitle']],
    fixtures:  ['Fixtures',    MD, ['fixtures~', 'title|Group Stage Fixtures', 'subtitle|Saturday · Kartik 14 · 7 AM Sharp']],
    format:    ['Format / draw', MD, ['groups~', 'label|Official Draw']],
    notice:    ['Notice',      MD, ['title*', 'label|Official Notice', 'sub', 'date', 'time', 'venue|Tamghas Futsal', 'rows~', 'body~', 'pill', 'qr', 'logo2', 'sign|Organizing Committee']],
    teams:     ['All teams',   MD, ['title|The Teams', 'subtitle']],
    champions: ['Champions',   MD, ['team@*', 'season|Season 1', 'label|Champions']],
    squad:     ['Team list',   'teamlist/teamlist.html', ['team@*', 'players~']],
    cover:     ['FB cover',    'teamlist/cover.html', []],
  };
  // Picker layout: [heading, kinds], each with an icon.
  const KIND_GROUPS = [['Match day', 'goal event score fixture motm'], ['League', 'table results scorers bracket fixtures'],
                       ['Other', 'notice squad teams format champions cover']];
  const ICON = { goal: '⚽', event: '🟨', score: '🏁', fixture: '📅', motm: '🌟', table: '📊', results: '📋', scorers: '🥇', bracket: '🏆',
                 fixtures: '🗓', notice: '📢', squad: '📝', teams: '👥', format: '🧩', champions: '🏆', cover: '🖼' };
  const EVENTS = { 'Yellow Card': '🟨', 'Red Card': '🟥', 'Second Yellow': '🟨🟥', 'Penalty Missed': '❌', 'Penalty Saved': '🧤', 'Injury': '🩹' };
  const OPTS = { 'event.event': Object.keys(EVENTS), 'score.label': ['Full Time', 'Half Time'], 'fixture.label': ['Next Match', 'Up Next', 'Kick-off'] };
  const SIZE = { cover: [1640, 624] };
  const HINTS = { rows: 'Date=Saturday · Kartik 14 (one per line; replaces date/time/venue)', qr: 'https://facebook.com/... (link for a QR code)', logo2: '../14starlogo.jpg', pill: 'Follow Now', score: '2-1', minute: '12', homeScorers: "Mishan KC 12'|Arjun KC 30'", awayScorers: "Arjun KC 25'", stat: '2 Goals' };
  const files = {};  // groups.txt, fixtures.txt, results.txt, squads.txt as published
  let kind = 'goal', editLog = null;  // { key: 'goals' | 'events', json } of the log entry being edited
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  const F = () => $('form').elements, val = n => F()[n]?.value ?? '';
  const set = (n, v) => { if (!F()[n]) return; F()[n].value = v; if (n === 'score') boxesFrom('sb', v); };
  // Score = two boxes with −/+ (one per team). attr 'sb' = graphic form, 'rb' = results card.
  const boxRow = (attr, side) => `<div class="sbox"><span class="sname" data-${attr}-name="${side}">${side === 'h' ? 'Home' : 'Away'}</span>
    <button type="button" data-step="${attr},${side},-1" aria-label="minus">−</button><input type="number" min="0" inputmode="numeric" data-${attr}="${side}" value="0">
    <button type="button" data-step="${attr},${side},1" aria-label="plus">+</button></div>`;
  const box = (attr, side) => document.querySelector(`[data-${attr}="${side}"]`);
  const boxesTo = attr => box(attr, 'h') ? `${+box(attr, 'h').value || 0}-${+box(attr, 'a').value || 0}` : '';
  const boxesFrom = (attr, v) => { const [h = 0, a = 0] = String(v || '').split('-').map(Number); if (box(attr, 'h')) { box(attr, 'h').value = h || 0; box(attr, 'a').value = a || 0; } };
  const boxNames = (attr, h, a) => { document.querySelectorAll(`[data-${attr}-name]`).forEach(el => { const t = el.dataset[`${attr}Name`] === 'h' ? h : a; el.textContent = t || (el.dataset[`${attr}Name`] === 'h' ? 'Home' : 'Away'); }); };
  document.addEventListener('click', e => {
    if (!e.target.dataset.step) return;
    const [attr, side, d] = e.target.dataset.step.split(','), i = box(attr, side);
    i.value = Math.max(0, (+i.value || 0) + +d); i.dispatchEvent(new Event('input', { bubbles: true }));
  });
  document.addEventListener('input', e => { if (e.target.dataset.sb) F().score.value = boxesTo('sb'); });

  // ---- Data: fixtures in playing order, squads, goals logged on this phone ----
  const fxText = () => store.get('fixtures') ?? files.fixtures ?? '', grText = () => store.get('groups') ?? files.groups ?? '';
  const roundName = g => /^[A-D]$/.test(g) ? `Group ${g}` : { QF: 'Quarter-Final', SF: 'Semi-Final' }[g] || g;
  const KO = ['QF', 'SF', 'Final'], isKO = m => KO.includes(m.g);
  const fixtures = () => { const seen = {}; return fxText().split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#')).map((l, i) => {
    const [g, vs, time = ''] = l.split(',').map(s => s.trim()), [h, a] = vs.split(/\s+v\s+/), k = seen[g] = (seen[g] || 0) + 1;
    return { n: i + 1, g, home: team(h).name, away: team(a).name, time, tag: g === 'Final' ? 'Final' : KO.includes(g) ? g + k : `${i + 1}` };
  }); };
  // Once knockout fixtures exist, pickers show only those matches and the teams still in them.
  const koFixtures = () => fixtures().filter(isKO);
  const liveFixtures = () => koFixtures().length ? koFixtures() : fixtures();
  const activeTeams = () => { const ko = koFixtures(); return ko.length ? TEAMS.filter(t => ko.some(m => m.home === t.name || m.away === t.name)) : TEAMS; };
  const matchName = m => isKO(m) ? (m.g === 'Final' ? 'Final' : `${roundName(m.g)} ${m.tag.slice(2)}`) : `Match ${m.n} · ${roundName(m.g)}`;
  const squads = () => Object.fromEntries(((store.get('squads') ?? files.squads) || '').split('\n')
    .filter(l => l.includes(':') && !l.startsWith('#')).map(l => [l.slice(0, l.indexOf(':')).trim(), l.slice(l.indexOf(':') + 1).trim()]));
  const players = t => (squads()[t] || '').split('|').map(s => s.trim()).filter(s => s && !/\((coach|manager)\)/i.test(s))
    .map(s => s.replace(/\((c|gk)\)/gi, '').replace(/\s+/g, ' ').trim());
  const goals = () => JSON.parse(store.get('goals') || '[]');  // [{n: match no., team, name, min}]
  const events = () => JSON.parse(store.get('events') || '[]');  // [{n, type, team, name, min}]
  // Per-match logs, edited with the same buttons. who = the form's player field.
  const LOG = { goals: { kind: 'goal', who: 'scorer', what: 'goal', title: 'Goals', all: goals },
                events: { kind: 'event', who: 'name', what: 'event', title: 'Key events', all: events } };
  const matchGoals = n => goals().filter(g => g.n == n);
  const tally = (n, h, a) => { const gs = matchGoals(n); return [gs.filter(g => g.team === h).length, gs.filter(g => g.team === a).length]; };
  const played = () => { try { return parseResults($('results').value).filter(r => !r.pens); } catch { return []; } };
  // A knockout result line carries its round ("QF: A 2-1 B"), so a Final between group rivals never replaces their group game.
  const samePair = (r, h, a) => [r.home.name, r.away.name].sort() + '' === [h, a].sort() + '';
  const resultOf = m => played().find(r => samePair(r, m.home, m.away) && (r.round || '') === (isKO(m) ? m.g : ''));
  const nextMatch = () => (liveFixtures().find(m => !resultOf(m)) || liveFixtures().at(-1) || {}).n || '';
  const matchOptions = () => liveFixtures().map(m => `<option value="${m.n}">${isKO(m) ? m.tag : m.n + '.'} ${m.time ? m.time + ' · ' : ''}${team(m.home).code} v ${team(m.away).code}${resultOf(m) ? ' ✓' : ''}</option>`).join('');

  $('kinds').innerHTML = KIND_GROUPS.map(([h, ks]) => `<h3${h === 'Match day' ? ' style="margin-top:0"' : ''}>${h}</h3><div class="kinds">${ks.split(' ').map(k =>
    `<button type="button" data-kind="${k}">${ICON[k]} ${KINDS[k][0]}</button>`).join('')}</div>`).join('');
  $('kinds').onclick = e => { const k = e.target.closest('[data-kind]')?.dataset.kind; if (k) { pick(k); $('form').scrollIntoView({ behavior: 'smooth', block: 'start' }); } };
  const teamOptions = () => `<option value="">— pick —</option>` + activeTeams().map(t => `<option>${esc(t.name)}</option>`).join('');

  // Bottom tabs. The preview needs to be visible to size itself, so it re-renders when Graphics opens.
  function tab(t) {
    document.querySelectorAll('[data-tab]').forEach(s => s.hidden = s.dataset.tab !== t);
    document.querySelectorAll('[data-go]').forEach(b => b.classList.toggle('on', b.dataset.go === t));
    local.set('tab', t); scrollTo(0, 0);
    if (t === 'make') $('png').innerHTML ? fit() : render();  // coming back keeps a saved image
  }
  document.querySelector('nav').onclick = e => { const t = e.target.closest('[data-go]')?.dataset.go; if (t) tab(t); };

  const matchLine = m => { const r = resultOf(m); return `${team(m.home).code},${team(m.away).code},${r ? (r.home.name === m.home ? `${r.hg}-${r.ag}` : `${r.ag}-${r.hg}`) : m.time}`; };

  function defaults() {
    const fx = fixtures(), tally5 = Object.values(goals().filter(g => g.name !== 'Own Goal').reduce((m, g) => {
      (m[g.name + g.team] ??= { name: g.name, team: g.team, n: 0 }).n++; return m; }, {})).sort((a, b) => b.n - a.n).slice(0, 12);
    return {
      fixtures: fxText(), groups: grText(),
      matches: (fx.some(resultOf) ? fx.filter(resultOf).slice(-7) : fx.slice(0, 7)).map(matchLine).join('\n'),
      players: tally5.map(p => `${p.name},${team(p.team).code},${p.n}`).join('\n'),
      ...Object.fromEntries(['qf', 'sf', 'final'].map(k => [k, fx.filter(m => m.g.toLowerCase() === k).map(m => `${team(m.home).code},${team(m.away).code}`).join('\n')])),
    };
  }

  function pick(k) {
    if (k !== kind) editLog = null;
    kind = k;
    document.querySelectorAll('[data-kind]').forEach(b => b.classList.toggle('on', b.dataset.kind === k));
    const defs = defaults();
    $('fields').innerHTML = KINDS[k][2].map(f => {
      const [name, def = defs[name.replace(/\W/g, '')] ?? ''] = f.replace(/[*~@#^=]/g, '').split('|'), req = f.includes('*');
      if (f.includes('=')) return `<input type="hidden" name="${name}">`;  // filled from the logs below
      const lbl = `${name === 'pick' ? 'Match' : name.replace(/([A-Z])/g, ' $1')}${req ? ' *' : ''}`;
      const opts = OPTS[`${k}.${name}`];
      const input = name === 'score' ? `<input type="hidden" name="score">${boxRow('sb', 'h')}${boxRow('sb', 'a')}`
        : name === 'pick' ? `<select name="pick">${matchOptions()}<option value="">Other (pick teams below)</option></select>`
        : f.includes('@') ? `<select name="${name}">${teamOptions()}</select>`
        : f.includes('#') ? `<select name="${name}" data-players></select>`
        : opts ? `<select name="${name}">${opts.map(o => `<option>${esc(o)}</option>`).join('')}</select>`
        : k === 'squad' && name === 'players' ? `<textarea name="players" hidden></textarea><div id="sqlist"></div>`
        : k === 'results' && name === 'matches' ? `<textarea name="matches" hidden>${esc(def)}</textarea><div id="mlist"></div>`
        : k === 'scorers' && name === 'players' ? `<textarea name="players" hidden>${esc(def)}</textarea><div class="msg">${def ? esc(def).split('\n').map(l => l.split(',')).map(([n, t, c]) => `${n} (${t}) — ${c}`).join('<br>') : 'No goals logged yet.'}<br><i>Counted from logged goals.</i></div>`
        : ['fixtures', 'format', 'bracket'].includes(k) && f.includes('~') ? (name === 'qf' || k !== 'bracket' ? `<div class="msg" style="margin:0 0 12px">${k === 'bracket' ? 'Teams come from the knockout fixtures and results.' : ''} Edit in the ${k === 'format' ? 'Groups' : 'Fixtures'} tab.</div>` : '') + `<textarea name="${name}" hidden>${esc(def)}</textarea>`
        : k === 'notice' && name === 'rows' ? `<textarea name="rows" hidden></textarea><div id="nrows"></div>`
        : f.includes('~') ? `<textarea name="${name}">${esc(def)}</textarea>`
        : `<input name="${name}" value="${esc(def)}" placeholder="${HINTS[name] || ''}" ${['minute', 'score'].includes(name) ? 'inputmode="numeric"' : ''}>`;
      if (k === 'bracket' && f.includes('~')) return input;  // filled from fixtures, nothing to type
      return name === 'score' ? `<label>${lbl}</label>${input}` : `<label>${lbl}${input}</label>`;  // a label around −/+ would press "−" when tapped
    }).join('') || '<p class="msg">No fields — just save it.</p>';
    if (['goal', 'score', 'event'].includes(k)) $('fields').insertAdjacentHTML('beforeend', '<div id="glog"></div>');
    if (F().score) F().score.value = '0-0';
    if (F().pick) { F().pick.value = store.get('pick') ?? nextMatch(); applyMatch(); }
    renderSquad(); renderMatchPick(); renderNoticeRows();
    render();
  }

  // Results graphic: tick which matches to show.
  function renderMatchPick() {
    if (!$('mlist')) return;
    const on = new Set(val('matches').split('\n'));
    $('mlist').innerHTML = liveFixtures().map(m => `<label class="rrow" style="margin:0;text-transform:none;letter-spacing:0;font-size:15px;color:#fff">
      <input type="checkbox" data-mline="${esc(matchLine(m))}" ${on.has(matchLine(m)) ? 'checked' : ''} style="width:22px;height:22px">
      <span style="flex:1">${m.n}. ${team(m.home).code} v ${team(m.away).code}</span><span class="msg" style="margin:0">${resultOf(m) ? matchLine(m).split(',')[2] : m.time}</span></label>`).join('');
  }
  // Notice info rows: label + value, added and removed with buttons.
  function renderNoticeRows() {
    if (!$('nrows')) return;
    const rows = val('rows') ? val('rows').split('\n').map(r => r.split('=')) : [];
    $('nrows').innerHTML = rows.map(([k, v = ''], i) => `<div class="rrow">
        <input data-nk="${i}" value="${esc(k)}" placeholder="Label" style="width:34%"><input data-nv="${i}" value="${esc(v)}" placeholder="Value" style="flex:1">
        <button type="button" class="danger" data-ndel="${i}" aria-label="Remove row">✕</button></div>`).join('')
      + `<button type="button" id="naddrow" style="margin-top:8px">+ Add info row</button>
         <div class="msg" style="margin-top:4px">Rows replace the date/time/venue lines when used.</div>`;
  }
  const noticeRowsFromDom = () => [...document.querySelectorAll('[data-nk]')].map((k, i) => [k.value.trim(), document.querySelector(`[data-nv="${i}"]`).value.trim()]);
  const setNoticeRows = rows => set('rows', rows.map(r => r.join('=')).join('\n'));

  // Match picked: fill teams, labels, time and the score so far.
  function applyMatch() {
    const n = val('pick'), m = fixtures()[n - 1];
    store.set('pick', n);
    if (m) {
      set('home', m.home); set('away', m.away);
      const [hs, as] = tally(n, m.home, m.away), label = matchName(m);
      if (kind === 'fixture') { set('match', label); set('time', m.time); }
      if (kind === 'score') { set('match', label); set('score', `${hs}-${as}`); fillFromLogs(); }
      if (kind === 'event') set('score', `${hs}-${as}`);
      if (kind === 'motm') set('match', `${m.home} ${hs}-${as} ${m.away}`);
    }
    fillPlayers();
  }

  // Final score lists come straight from the goal and card logs.
  function fillFromLogs() {
    const n = val('pick'), min = x => x.min ? ` ${x.min}'` : '';
    const scorers = t => matchGoals(n).filter(g => g.team === t).map(g => g.name === 'Own Goal' ? `OG${min(g)}` : g.name + min(g)).join('|');
    const cards = t => events().filter(x => x.n == n && x.team === t && /card|yellow/i.test(x.type))
      .map(x => `${/yellow card/i.test(x.type) ? 'Y' : 'R'} ${x.name}${min(x)}`).join('|');
    set('homeScorers', scorers(val('home'))); set('awayScorers', scorers(val('away')));
    set('homeCards', cards(val('home'))); set('awayCards', cards(val('away')));
  }

  // Player dropdowns list both teams' squads; picking a player sets their team (and the new score for a goal).
  function fillPlayers() {
    const teams = [val('home'), val('away')].filter(Boolean);
    document.querySelectorAll('[data-players]').forEach(s => {
      const keep = s.value;
      s.innerHTML = '<option value="">— pick —</option>' + teams.map(t => `<optgroup label="${esc(t)}">
        ${players(t).map(p => `<option data-team="${esc(t)}">${esc(p)}</option>`).join('')}
        ${kind === 'goal' ? `<option data-team="${esc(t)}" value="Own Goal">Own goal (counts for ${esc(t)})</option>` : ''}</optgroup>`).join('');
      s.value = keep;
    });
    boxNames('sb', val('home') && team(val('home')).code, val('away') && team(val('away')).code);
    if ($('glog')) $('glog').innerHTML = (kind === 'goal' ? ['goals'] : kind === 'event' ? ['events'] : ['goals', 'events']).map(logSection).join('');
  }

  function logSection(key) {
    const L = LOG[key], items = L.all().filter(x => x.n == val('pick')).sort((a, b) => a.min - b.min);
    return `<label style="margin-top:12px">${L.title} this match</label>`
      + (items.map(x => { const j = esc(JSON.stringify(x)), on = editLog?.key === key && editLog.json === JSON.stringify(x);
          return `<div class="rrow" ${on ? 'style="background:rgba(245,130,32,.15)"' : ''}>
            <span style="flex:1">${key === 'goals' ? '⚽' : EVENTS[x.type] || '•'} ${x.min ? x.min + "' " : ''}${esc(x.name)} <span class="msg">(${team(x.team).code})${key === 'events' ? ' · ' + esc(x.type) : ''}</span></span>
            <button type="button" data-ledit="${key}" data-lj="${j}" aria-label="Edit">✎</button><button type="button" class="danger" data-ldel="${key}" data-lj="${j}" aria-label="Delete">✕</button></div>`; }).join('')
        || `<p class="msg">None logged yet.</p>`)
      + (kind !== L.kind ? '' : editLog?.key === key
        ? `<div style="margin-top:8px"><button type="button" class="primary" data-lsave="${key}">Update ${L.what}</button> <button type="button" data-lcancel>Cancel</button></div>`
        : `<button type="button" data-lsave="${key}" style="margin-top:8px">Log ${L.what} without image</button>`);
  }

  $('form').onchange = e => {
    const n = e.target.name;
    if (n === 'pick') applyMatch();
    if (n === 'home' || n === 'away') fillPlayers();
    if (e.target.dataset.players !== undefined) {
      const t = e.target.selectedOptions[0]?.dataset.team;
      if (t) set('team', t);
      if (kind === 'goal' && t) {
        const [hs, as] = tally(val('pick'), val('home'), val('away'));
        set('score', `${hs + (t === val('home'))}-${as + (t === val('away'))}`);
      }
    }
    if (kind === 'squad' && n === 'team') { set('players', (squads()[e.target.value] || '').split('|').join('\n')); renderSquad(); }
    if (e.target.dataset.role) {
      let ps = squadList(), i = +e.target.dataset.role;
      if (e.target.value.includes('(C)')) ps = ps.map(p => p.replace(/\s*\(C\)/i, ''));  // one captain per team
      ps[i] = `${ps[i].replace(/\(.*?\)/g, '').trim()} ${e.target.value}`.trim();
      return setSquad(ps);
    }
    render();
  };
  $('form').addEventListener('input', e => { if (e.target.dataset.nk || e.target.dataset.nv) setNoticeRows(noticeRowsFromDom()); });
  $('form').addEventListener('change', e => {
    if (e.target.dataset.mline === undefined) return;
    set('matches', [...document.querySelectorAll('[data-mline]:checked')].map(c => c.dataset.mline).join('\n'));
    const n = document.querySelectorAll('[data-mline]:checked').length;
    $('msg').className = n > 7 ? 'msg err' : 'msg'; $('msg').textContent = n > 7 ? `${n} matches ticked — 7 fit on one graphic.` : '';
  });
  $('form').oninput = e => { if (e.target.tagName !== 'SELECT') { clearTimeout(render.t); render.t = setTimeout(render, 400); } };
  $('form').onclick = e => {
    const ld = e.target.dataset;
    if (ld.ldel) {
      if (!canEdit($('msg')) || !confirm(`Delete this ${LOG[ld.ldel].what}?`)) return;
      if (editLog?.json === ld.lj) editLog = null;
      store.set(ld.ldel, JSON.stringify(LOG[ld.ldel].all().filter(x => JSON.stringify(x) !== ld.lj)));
      return applyMatch(), fillResultMatch(), render();
    }
    if (ld.ledit) {  // load the entry into its form; "Update" (or Save image) writes it back
      const L = LOG[ld.ledit], x = JSON.parse(ld.lj);
      store.set('pick', x.n);
      if (kind !== L.kind) pick(L.kind);
      editLog = { key: ld.ledit, json: ld.lj };
      fillPlayers(); set(L.who, x.name); set('minute', x.min); set('team', x.team); if (x.type) set('event', x.type);
      return fillPlayers(), render();
    }
    if (ld.lsave) return logEntry(ld.lsave);
    if (ld.lcancel !== undefined) return editLog = null, fillPlayers();
    if (e.target.id === 'naddrow') { setNoticeRows([...noticeRowsFromDom(), ['', '']]); renderNoticeRows(); return [...document.querySelectorAll('[data-nk]')].at(-1)?.focus(); }
    if (e.target.dataset.ndel) { const r = noticeRowsFromDom(); r.splice(e.target.dataset.ndel, 1); setNoticeRows(r); renderNoticeRows(); return render(); }
    // Squad editor buttons
    const d = e.target.dataset, ps = squadList();
    if (d.pdel) { if (confirm(`Remove ${ps[d.pdel].replace(/\(.*?\)/g, '').trim()}?`)) { ps.splice(d.pdel, 1); setSquad(ps); } }
    if (d.pedit) {
      const role = (ps[d.pedit].match(/\(.*\)/) || [''])[0], name = prompt('Player name', ps[d.pedit].replace(/\(.*?\)/g, '').trim());
      if (name?.trim()) { ps[d.pedit] = `${name.trim()} ${role}`.trim(); setSquad(ps); }
    }
    if (d.up && +d.up > 0) { ps.splice(d.up - 1, 0, ps.splice(d.up, 1)[0]); setSquad(ps); }
    if (e.target.id === 'addp' && $('newp').value.trim()) { ps.push($('newp').value.trim()); setSquad(ps); $('newp').focus(); }
  };

  // ---- Squad editor: rows with role, edit, move up, remove; every change is saved (and shared when signed in) ----
  const ROLES = [['', 'Player'], ['(C)', 'C'], ['(GK)', 'GK'], ['(C) (GK)', 'C + GK'], ['(Coach)', 'Coach'], ['(Manager)', 'Mgr']];
  const squadList = () => val('players').split('\n').map(s => s.trim()).filter(Boolean);
  function setSquad(ps) {
    set('players', ps.join('\n'));
    if (val('team')) { const all = squads(); all[val('team')] = ps.join('|'); store.set('squads', Object.entries(all).map(([t, p]) => `${t}: ${p}`).join('\n')); }
    renderSquad(); render();
  }
  function renderSquad() {
    if (!$('sqlist')) return;
    $('sqlist').innerHTML = squadList().map((p, i) => {
      const role = (p.match(/\(.*\)/) || [''])[0].replace(/\s+/g, ' ').toLowerCase();
      return `<div class="rrow"><span style="width:22px;color:var(--orange);font-weight:700">${i + 1}</span>
        <span style="flex:1;color:#fff;text-transform:none;letter-spacing:0;font-size:15px">${esc(p.replace(/\(.*?\)/g, '').trim())}</span>
        <select data-role="${i}">${ROLES.map(([v, l]) => `<option value="${v}" ${v.toLowerCase() === role ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <button type="button" data-pedit="${i}" aria-label="Rename">✎</button><button type="button" data-up="${i}" aria-label="Move up">↑</button><button type="button" class="danger" data-pdel="${i}" aria-label="Remove">✕</button></div>`;
    }).join('') + `<div class="rrow"><input id="newp" placeholder="New player name" style="flex:1"><button type="button" class="primary" id="addp">Add</button></div>`;
  }

  function params() {
    const p = { type: kind, ...Object.fromEntries(new FormData($('form'))) };
    delete p.pick;
    if (kind === 'table') Object.assign(p, { results: $('results').value, groups: grText() });
    for (const k of ['players', 'matches', 'rows', 'qf', 'sf', 'final']) if (p[k]) p[k] = p[k].split('\n').map(s => s.trim()).filter(l => l && l !== '=').join('|');
    return p;
  }

  const fit = () => {
    const [w, h] = SIZE[kind] || [W, H], f = $('frame');
    f.style.width = w + 'px'; f.style.height = h + 'px';
    const s = $('preview').clientWidth / w;
    f.style.transform = `scale(${s})`; $('preview').style.height = h * s + 'px';
  };
  function render() {
    fit();
    $('frame').src = `${KINDS[kind][1]}?${new URLSearchParams(params())}`;
    $('png').innerHTML = ''; $('msg').className = 'msg'; $('msg').textContent = '';
  }
  // Only rescale on resize: phones fire it when the address bar slides away, which used to wipe the saved image.
  addEventListener('resize', fit);

  // Google Fonts CSS with every font file inlined, so the PNG keeps Bebas/Barlow (html-to-image can't read cross-origin CSS).
  const fontCache = {};
  const fontCSS = doc => {
    const href = doc.querySelector('link[href*="fonts.googleapis"]')?.href;
    return href ? fontCache[href] ??= fetch(href).then(r => r.text()).then(async css => {
      for (const u of new Set(css.match(/https:\/\/fonts\.gstatic\.com[^)'"]+/g))) {
        const b = await fetch(u).then(r => r.blob());
        css = css.replaceAll(u, await new Promise(ok => { const f = new FileReader(); f.onload = () => ok(f.result); f.readAsDataURL(b); }));
      }
      return css;
    }) : '';
  };

  $('save').onclick = async () => {
    const msg = $('msg');
    clearTimeout(render.t); render();  // always export what the form says now, not a half-updated preview
    await new Promise(ok => $('frame').onload = ok);
    const doc = $('frame').contentDocument;
    if (doc.querySelector('.err')) { msg.className = 'msg err'; return msg.textContent = 'Fix the red error first: ' + doc.querySelector('.err').textContent; }
    msg.className = 'msg'; msg.textContent = 'Making image…';
    try {
      await doc.fonts.ready;
      const [w, h] = SIZE[kind] || [W, H], opts = { width: w, height: h, pixelRatio: 1, fontEmbedCSS: await fontCSS(doc) };
      // ponytail: render twice; iOS Safari often drops fonts/images on the first pass
      await htmlToImage.toBlob(doc.documentElement, opts);
      const blob = await htmlToImage.toBlob(doc.documentElement, opts);
      const name = `tsl-${kind}-${Date.now()}.png`, file = new File([blob], name, { type: 'image/png' }), url = URL.createObjectURL(blob);
      $('png').innerHTML = `<div class="actions" style="margin-top:12px"><button class="primary" id="fb">f Post on Facebook</button><button id="share">📤 Share…</button></div>
        <div class="actions"><button type="button" id="copycap">📋 Copy caption</button><a class="btn" id="dl" href="${url}" download="${name}">⬇ Download</a></div>
        <label style="margin-top:12px">Caption<textarea id="cap" style="min-height:110px">${esc(caption())}</textarea></label>
        <img src="${url}" alt="">`;
      const copy = () => navigator.clipboard?.writeText($('cap').value).catch(() => { $('cap').select(); document.execCommand('copy'); });
      // Facebook won't take pre-filled text from other apps, so the caption is copied in the same tap.
      // "Post on Facebook" works on any phone, with or without the Facebook app: save the image, open Facebook, paste.
      // "Share…" is the phone's own share sheet (Facebook only shows there if its app is installed).
      const viaFacebook = () => { $('dl').click(); open('https://www.facebook.com/', '_blank');
        msg.textContent = 'Image saved & caption copied ✓ In Facebook: Photo → pick the newest image → paste the caption.'; };
      $('fb').onclick = () => { copy(); viaFacebook(); };
      $('share').onclick = () => {
        copy();
        if (!navigator.canShare?.({ files: [file] })) return viaFacebook();
        navigator.share({ files: [file] }).catch(e => e.name !== 'AbortError' && viaFacebook());
        msg.textContent = 'Caption copied ✓ Pick an app, then paste the caption.';
      };
      $('copycap').onclick = () => { copy(); msg.textContent = 'Caption copied ✓'; };
      $('png').scrollIntoView({ behavior: 'smooth', block: 'start' });
      msg.textContent = 'Done ✓';
      if (kind === 'goal') logEntry('goals');
      if (kind === 'event') logEntry('events');
      // A Full Time score is the result: record it so the points table updates without a second step.
      if (kind === 'score' && val('label') === 'Full Time' && /^\d+-\d+$/.test(val('score').replace(/\s/g, ''))) {
        setResult(val('home'), val('score').replace(/\s/g, ''), val('away'), false, roundOf(val('pick')));
        msg.textContent += ' Result added — points table updated.';
      }
    } catch (e) { msg.className = 'msg err'; msg.textContent = 'Could not make the image: ' + (e.message || e); }
  };

  // Saved goal graphics are remembered per match: they feed the next goal's score, the final score and top scorers.
  // Ready-to-post caption for the graphic on screen.
  function caption() {
    const v = val, min = v('minute') ? ` (${v('minute')}')` : '', lines = k => v(k) ? v(k).split('|').join(', ') : '';
    const c = {
      goal: `⚽ GOAL! ${v('scorer')}${min} for ${v('team')}!\n${v('home')} ${v('score')} ${v('away')}`,
      score: `🏁 ${v('label')}: ${v('home')} ${v('score')} ${v('away')}${lines('homeScorers') ? `\n⚽ ${v('home')}: ${lines('homeScorers')}` : ''}${lines('awayScorers') ? `\n⚽ ${v('away')}: ${lines('awayScorers')}` : ''}`,
      event: `${EVENTS[v('event')] || ''} ${v('event')}: ${v('name')}${min} — ${v('team')}${v('score') ? `\n${v('home')} ${v('score')} ${v('away')}` : ''}`,
      fixture: `📅 ${v('label')}: ${v('home')} vs ${v('away')}\n🕖 ${[v('time'), v('date')].filter(Boolean).join(' · ')}\n📍 ${v('venue')}`,
      table: `📊 TSL points table${v('subtitle') ? ` — ${v('subtitle')}` : ''}. Top ${v('qualify')} from each group reach the ${v('next')}!`,
      results: `📋 ${v('title')}${v('subtitle') ? ` — ${v('subtitle')}` : ''}`,
      motm: `🌟 Man of the Match: ${v('name')} (${v('team')})${v('match') ? `\n${v('match')}` : ''}`,
      scorers: `🥇 ${v('title')} so far in the Tamghas Super League`,
      fixtures: `📅 ${v('title')}\n${v('subtitle')}\n📍 Tamghas Futsal`,
      format: `🏆 TSL ${v('label')}: 13 teams, 4 groups — top 2 from each group go to the quarter-finals.`,
      notice: `📢 ${v('title')}${v('body') ? `\n\n${v('body')}` : ''}${v('qr') ? `\n\n👉 ${v('qr')}` : ''}`,
      teams: `👥 ${v('title')} of the Tamghas Super League`, champions: `🏆 ${v('team')} — ${v('label')}!`, squad: `👥 ${v('team')} — official squad`,
    }[kind] || '';
    return `${c}\n\n#TSL #TamghasSuperLeague #Futsal #Gulmi`.trim();
  }

  // Adds the goal/event in the form, or replaces the one being edited.
  function logEntry(key) {
    const L = LOG[key], msg = $('msg'), base = { n: val('pick'), team: val('team'), name: val(L.who), min: val('minute') };
    const x = key === 'goals' ? base : { n: base.n, type: val('event'), team: base.team, name: base.name, min: base.min };
    if (!x.n || !x.name || !x.team) { msg.className = 'msg err'; return msg.textContent = 'Pick the match and player first.'; }
    if (!canEdit(msg)) return;
    const all = L.all(), j = JSON.stringify(x);
    if (editLog?.key === key) store.set(key, JSON.stringify(all.map(y => JSON.stringify(y) === editLog.json ? x : y)));
    else if (!all.some(y => JSON.stringify(y) === j)) store.set(key, JSON.stringify([...all, x]));
    msg.className = 'msg'; msg.textContent += editLog ? ` ${L.what[0].toUpperCase() + L.what.slice(1)} updated.` : ` ${L.what[0].toUpperCase() + L.what.slice(1)} logged.`;
    editLog = null;
    fillPlayers(); fillResultMatch();
  }

  // ---- Results: kept on this phone; the table preview updates as you type ----
  const saveResults = () => {
    try { parseResults($('results').value); $('rmsg').className = 'msg'; $('rmsg').textContent = sync.user ? 'Saved & shared ✓' : 'Saved on this phone ✓'; }
    catch (e) { $('rmsg').className = 'msg err'; $('rmsg').textContent = e.message; }
    store.set('results', $('results').value);
    if (kind === 'table') render();
  };
  const canEdit = (el = $('rmsg')) => {
    const why = sync.db && (sync.db.failed ? 'No connection to the live data, so this would not be saved. Reload when you have signal.' : !sync.user ? 'View only: tap "Sign in" at the top to make changes.' : !sync.ready && 'Still loading the live data, try again in a moment.');
    return !why || (el.className = 'msg err', el.textContent = why, false);
  };
  const resultLines = () => $('results').value.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#'));
  const removeLine = l => $('results').value = resultLines().filter(x => x !== l).join('\n') + '\n';
  let editing = null;  // the result line being edited
  const endEdit = () => { editing = null; $('radd').textContent = 'Add result'; $('rcancel').hidden = true; };
  // Knockout results on top; the finished group stage folds away.
  function renderResults() {
    const rows = resultLines().map(l => { let r; try { [r] = parseResults(l); } catch {} return { l, r }; });
    const row = ({ l, r }) => `<div class="rrow"><span style="flex:1">${r ? `${r.round ? `<span class="tag">${r.round}</span> ` : ''}${esc(team(r.home.name).code)} <b style="color:var(--orange)">${r.hg}-${r.ag}</b> ${esc(team(r.away.name).code)}${r.pens ? ' <i>(pens)</i>' : ''}` : `<span class="err">${esc(l)}</span>`}</span>
        <button data-edit="${esc(l)}" aria-label="Edit">✎</button><button class="danger" data-rdel="${esc(l)}" aria-label="Delete">✕</button></div>`;
    const ko = rows.filter(x => x.r?.round), grp = rows.filter(x => !x.r?.round);
    $('rlist').innerHTML = (ko.map(row).join('') || (grp.length ? '<p class="msg">No knockout results yet.</p>' : '<p class="msg">No results yet.</p>'))
      + (grp.length ? `<details${ko.length || koFixtures().length ? '' : ' open'}><summary>Group stage · ${grp.length} results</summary>${grp.map(row).join('')}</details>` : '');
  }
  $('rlist').onclick = e => {
    const { edit, rdel } = e.target.closest('button')?.dataset || {};
    if (rdel && canEdit() && confirm(`Delete this result?\n${rdel}`)) { removeLine(rdel); endEdit(); saveResults(); refreshResultMatches(); }
    if (edit) {
      const [r] = parseResults(edit);
      editing = edit;
      $('rm').value = fixtures().find(m => samePair(r, m.home, m.away) && (r.round || '') === (isKO(m) ? m.g : ''))?.n || '';
      $('rh').value = r.home.name; $('ra').value = r.away.name; boxesFrom('rb', `${r.hg}-${r.ag}`); $('rp').checked = r.pens; resultNames();
      $('radd').textContent = 'Update result'; $('rcancel').hidden = false;
      $('rm').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  };
  $('rcancel').onclick = () => { endEdit(); refreshResultMatches(); };
  const fillResultMatch = () => {
    const m = fixtures()[$('rm').value - 1];
    if (!m) return;
    $('rh').value = m.home; $('ra').value = m.away;
    const [hs, as] = tally(m.n, m.home, m.away);
    boxesFrom('rb', `${hs}-${as}`); resultNames();
  };
  const refreshResultMatches = () => {
    $('rm').innerHTML = matchOptions() + '<option value="">Other (pick teams below)</option>';
    if (!editing) { $('rm').value = nextMatch(); fillResultMatch(); }  // don't wipe a half-done edit when another phone syncs
    renderResults();
  };
  $('rm').onchange = fillResultMatch;
  const resultNames = () => boxNames('rb', $('rh').value, $('ra').value);
  $('rh').onchange = $('ra').onchange = resultNames;
  // One result per match: a corrected score replaces the old line instead of counting twice.
  const roundOf = n => { const m = fixtures()[n - 1]; return m && isKO(m) ? m.g : ''; };
  function setResult(h, sc, a, pens = false, round = '') {
    if (!canEdit()) return;
    if (editing) { removeLine(editing); endEdit(); }
    const same = l => { try { const [r] = parseResults(l); return r && r.pens === pens && (r.round || '') === round && samePair(r, h, a); } catch { return false; } };
    $('results').value = $('results').value.split('\n').filter(l => !same(l)).join('\n').replace(/\n*$/, '\n') + `${round ? round + ': ' : ''}${h} ${sc} ${a}${pens ? ' (pens)' : ''}\n`;
    saveResults(); store.set('pick', nextMatch()); refreshResultMatches();
  }
  $('radd').onclick = () => {
    const s = boxesTo('rb'), h = $('rh').value, a = $('ra').value;
    if (!h || h === a) { $('rmsg').className = 'msg err'; return $('rmsg').textContent = 'Pick two different teams.'; }
    setResult(h, s, a, $('rp').checked, roundOf($('rm').value)); $('rp').checked = false;
  };
  $('rtable').onclick = () => { tab('make'); pick('table'); };

  // ---- Fixtures: add / edit / move / delete. Times stay with their slot; logged goals follow their match. ----
  const ROUNDS = ['A', 'B', 'C', 'D', 'QF', 'SF', 'Final'];
  const to24 = t => { const m = String(t).match(/(\d+):(\d+)\s*(AM|PM)/i); return m ? `${String(+m[1] % 12 + (m[3].toUpperCase() === 'PM' ? 12 : 0)).padStart(2, '0')}:${m[2]}` : ''; };
  const to12 = v => { if (!v) return ''; const [h, mi] = v.split(':').map(Number); return `${h % 12 || 12}:${String(mi).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`; };
  let editingFx = null;  // match number being edited
  function saveFixtures(list) {  // list items keep their old .n (null = new) so goals and the picked match can follow them
    const remap = new Map(list.map((m, i) => [String(m.n), String(i + 1)]));
    for (const key of ['goals', 'events']) {
      const gs = LOG[key].all(), kept = gs.filter(g => remap.has(String(g.n))).map(g => ({ ...g, n: remap.get(String(g.n)) }));
      if (JSON.stringify(kept) !== JSON.stringify(gs)) store.set(key, JSON.stringify(kept));
    }
    if (remap.has(String(store.get('pick')))) store.set('pick', remap.get(String(store.get('pick'))));
    store.set('fixtures', '# Group, Home v Away, time — edited in the phone maker\n' + list.map(m => `${m.g}, ${m.home} v ${m.away}${m.time ? `, ${m.time}` : ''}`).join('\n') + '\n');
    endFxEdit(); renderFixtures(); refreshResultMatches();
    if (['goal', 'score', 'event', 'fixture', 'motm', 'fixtures', 'results'].includes(kind)) pick(kind);
  }
  const endFxEdit = () => {
    editingFx = null; $('fadd').textContent = 'Add fixture'; $('fcancel').hidden = true;
    const ko = koFixtures();
    if (ko.length) { $('fg').value = ko.filter(m => m.g === 'SF').length < 2 ? 'SF' : 'Final'; $('ft').value = ''; return; }  // knockouts: next round, no fixed time
    const [h, m] = (to24(fixtures().at(-1)?.time) || '06:25').split(':').map(Number), x = h * 60 + m + 35;  // next slot = last + 35 min
    $('ft').value = `${String(Math.floor(x / 60) % 24).padStart(2, '0')}:${String(x % 60).padStart(2, '0')}`;
  };
  // Knockout fixtures on top; the group stage folds away once knockouts exist.
  function renderFixtures() {
    const row = m => `<div class="rrow" ${m.n === editingFx ? 'style="background:rgba(245,130,32,.15)"' : ''}>
        <span style="flex:1"><span class="tag">${isKO(m) ? m.tag : m.g}</span> ${team(m.home).code} v ${team(m.away).code}
          <span class="msg" style="display:inline;margin:0">${esc(m.time)}${resultOf(m) ? ' ✓' : ''}</span></span>
        <button data-fedit="${m.n}" aria-label="Edit">✎</button><button data-fup="${m.n}" aria-label="Move up">↑</button><button class="danger" data-fdel="${m.n}" aria-label="Delete">✕</button></div>`;
    const ko = koFixtures(), grp = fixtures().filter(m => !isKO(m));
    $('flist').innerHTML = (ko.map(row).join('') || (grp.length ? '' : '<p class="msg">No fixtures yet.</p>'))
      + (grp.length ? `<details${ko.length ? '' : ' open'}><summary>Group stage · ${grp.length} matches</summary>${grp.map(row).join('')}</details>` : '');
  }
  $('flist').onclick = e => {
    const d = e.target.closest('button')?.dataset || {}, list = fixtures(), fmsg = $('fmsg');
    if (d.fedit) {
      const m = list[d.fedit - 1]; editingFx = m.n;
      $('fh').value = m.home; $('fa').value = m.away; $('fg').value = m.g; $('ft').value = to24(m.time);
      $('fadd').textContent = 'Update fixture'; $('fcancel').hidden = false; renderFixtures();
      return $('fh').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    if (!canEdit(fmsg)) return;
    if (d.fup && d.fup > 1) {  // swap the matchups, keep the kick-off times in their slots
      const i = d.fup - 1, [a, b] = [list[i - 1], list[i]];
      [a.time, b.time] = [b.time, a.time]; list[i - 1] = b; list[i] = a;
      saveFixtures(list);
    }
    if (d.fdel) {
      const m = list[d.fdel - 1], ng = matchGoals(m.n).length + events().filter(x => x.n == m.n).length;
      if (confirm(`Delete match ${m.n}: ${m.home} v ${m.away}?${ng ? `\nIts ${ng} logged goal(s)/event(s) will be deleted too.` : ''}`)) saveFixtures(list.filter(x => x !== m));
    }
  };
  $('fadd').onclick = () => {
    const fmsg = $('fmsg'), h = $('fh').value, a = $('fa').value;
    if (!h || !a || h === a) { fmsg.className = 'msg err'; return fmsg.textContent = 'Pick two different teams.'; }
    if (!canEdit(fmsg)) return;
    const list = fixtures(), m = { n: editingFx, g: $('fg').value, home: h, away: a, time: to12($('ft').value) };
    if (editingFx) list[editingFx - 1] = m; else list.push(m);
    fmsg.className = 'msg'; fmsg.textContent = editingFx ? 'Fixture updated ✓' : 'Fixture added ✓';
    saveFixtures(list);
  };
  $('fcancel').onclick = () => { endFxEdit(); renderFixtures(); };

  // ---- Groups: move a team with its dropdown ----
  function renderGroups() {
    let gs; try { gs = parseGroups(grText()); } catch (e) { return $('grlist').innerHTML = `<p class="msg err">${esc(e.message)}</p>`; }
    const letters = gs.map(g => g.name.split(/\s+/).pop());
    $('grlist').innerHTML = gs.map((g, gi) => `<label style="margin-top:12px;color:var(--orange)">${esc(g.name)} · ${g.teams.length} teams</label>`
      + g.teams.map(t => `<div class="rrow"><span style="flex:1">${esc(t.name)}</span>
          <select data-gmove="${esc(t.name)}">${letters.map((l, li) => `<option value="${li}" ${li === gi ? 'selected' : ''}>Group ${l}</option>`).join('')}</select></div>`).join('')).join('');
  }
  $('grlist').onchange = e => {
    if (!e.target.dataset.gmove || !canEdit($('grmsg'))) return renderGroups();
    const gs = parseGroups(grText()), name = e.target.dataset.gmove;
    gs.forEach(g => g.teams = g.teams.filter(t => t.name !== name));
    gs[e.target.value].teams.push(team(name));
    store.set('groups', gs.map(g => `${g.name}\n${g.teams.map(t => t.name).join('\n')}`).join('\n\n') + '\n');
    $('grmsg').className = 'msg'; $('grmsg').textContent = `${name} moved to ${gs[e.target.value].name} ✓`;
    renderGroups();
    if (['table', 'format'].includes(kind)) pick(kind);
  };

  Promise.all(['matchday/groups.txt', 'matchday/fixtures.txt', 'matchday/results.txt', 'teamlist/squads.txt'].map(text)).then(([g, f, r, sq]) => {
    Object.assign(files, { groups: g, fixtures: f, results: r, squads: sq });
    $('results').value = store.get('results') ?? r;
    $('rbox').innerHTML = boxRow('rb', 'h') + boxRow('rb', 'a');
    fillTeamSelects();
    $('fg').innerHTML = ROUNDS.map(r => `<option value="${r}">${r}</option>`).join('');
    endFxEdit(); renderFixtures(); renderGroups();
    refreshResultMatches();
    pick('goal'); tab(local.get('tab') || 'make');
    startSync();
  });

  const status = (t, cls = '') => { $('sync').textContent = t; $('sync').className = cls; };
  // Team dropdowns outside the graphic form; refreshed when fixtures change (knockouts narrow the list).
  function fillTeamSelects() {
    for (const id of ['rh', 'ra', 'fh', 'fa']) { const v = $(id).value; $(id).innerHTML = teamOptions(); $(id).value = v; }
  }

  // ---- Live sharing: every phone sees the same results/goals/squads; only the signed-in organiser can change them ----
  function startSync() {
    if (location.search.includes('nosync')) return;  // ?nosync = local test without touching live data
    if (typeof FIREBASE === 'undefined' || !window.firebase) {  // scripts didn't load (bad signal): block edits, they'd be lost on the next sync
      sync.db = { failed: true };
      return status('No connection — reload to edit', 'bad');
    }
    firebase.initializeApp(FIREBASE);
    sync.db = firebase.database().ref('tsl');
    const auth = firebase.auth();
    let remote = {};
    const label = () => sync.user ? 'Live · organiser ✓' : 'Live · view only — Sign in';
    const seed = () => sync.user && sync.ready && SHARED.forEach(k => remote[k] == null && local.get(k) != null && sync.db.child(k).set(local.get(k)));
    auth.onAuthStateChanged(u => { sync.user = u; status(label(), u && 'ok'); seed(); });
    // One listener per shared key (not the whole tsl tree, which now holds the history too).
    SHARED.forEach(k => sync.db.child(k).on('value', snap => {
      remote[k] = snap.val();
      if (remote[k] != null) local.set(k, remote[k]);
      if (!sync.ready && !SHARED.every(x => x in remote)) return;  // wait until every key has loaded once
      sync.ready = true;
      seed();
      if (document.activeElement !== $('results')) $('results').value = local.get('results') ?? files.results;
      fillTeamSelects(); refreshResultMatches(); if (!editingFx) endFxEdit(); renderFixtures(); renderGroups();
      if ($('glog')) fillPlayers();
      if (['table', 'results', 'scorers', 'fixtures', 'format'].includes(kind) && !$('png').innerHTML) pick(kind);  // keep a saved image on screen
    }));
    firebase.database().ref('.info/connected').on('value', c => c.val() ? status(label(), sync.user && 'ok') : status('Offline — will sync when back', 'bad'));
    $('sync').onclick = () => sync.user ? confirm('Sign out of organiser mode on this phone?') && auth.signOut() : $('login').showModal();
    $('loginform').onsubmit = e => {
      if (e.submitter?.value !== 'ok') return;
      e.preventDefault();
      const f = e.target.elements;
      auth.signInWithEmailAndPassword(f.email.value.trim(), f.password.value)
        .then(() => $('login').close()).catch(err => $('loginmsg').textContent = err.message);
    };
  }
</script>
</body>
</html>
