<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TSL Matchday</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<script src="league.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root { --navy: #0a1a3f; --navy-2: #12285c; --row: rgba(14,32,78,.82); --orange: #f58220; --muted: #9fb0d6; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; background: var(--navy); }
  body {
    font-family: 'Barlow', sans-serif; color: #fff; position: relative; overflow: hidden;
    background:
      radial-gradient(900px 600px at 50% -10%, rgba(245,130,32,.18), transparent 60%),
      linear-gradient(180deg, var(--navy-2) 0%, var(--navy) 55%);
  }
  .bg { position: absolute; inset: 0; }
  .stripe { position: absolute; left: 0; right: 0; height: 10px; background: var(--orange); }
  .stripe.top { top: 0; } .stripe.bottom { bottom: 0; }
  header { position: relative; text-align: center; padding-top: 54px; }
  .logo {
    width: 130px; height: 130px; border-radius: 50%; margin: 0 auto; background: #fff; padding: 3px;
    box-shadow: 0 0 0 5px var(--orange), 0 16px 40px rgba(0,0,0,.45);
  }
  .logo img { width: 100%; height: 100%; border-radius: 50%; display: block; }
  .league { margin-top: 24px; font-weight: 700; font-size: 22px; letter-spacing: 10px; color: var(--orange); }
  main {
    position: absolute; top: 250px; bottom: 100px; left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  }
  footer {
    position: absolute; bottom: 44px; left: 0; right: 0; text-align: center;
    font-weight: 600; font-size: 20px; letter-spacing: 8px; color: var(--muted);
  }
  footer b { color: var(--orange); font-weight: 700; }

  /* shared pieces */
  .bebas { font-family: 'Bebas Neue', sans-serif; font-weight: 400; line-height: .95; letter-spacing: 2px; }
  .kicker { font-weight: 700; font-size: 24px; letter-spacing: 8px; color: var(--orange); text-transform: uppercase; }
  .label {
    display: inline-flex; align-items: center; gap: 18px;
    font-weight: 600; font-size: 22px; letter-spacing: 8px; color: var(--muted); text-transform: uppercase;
  }
  .label::before, .label::after { content: ''; width: 60px; height: 2px; background: var(--orange); }
  .crest {
    width: var(--s, 200px); height: var(--s, 200px); border-radius: 50%; flex: none;
    background: radial-gradient(circle at 50% 30%, #1d3a7c, var(--navy));
    box-shadow: 0 0 0 calc(var(--s, 200px) * .035) var(--orange), 0 16px 40px rgba(0,0,0,.4);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Bebas Neue', sans-serif; font-size: calc(var(--s, 200px) * .4); line-height: 1; letter-spacing: 2px;
  }
  .tname { text-wrap: balance; font-family: 'Bebas Neue', sans-serif; font-size: 50px; line-height: 1; letter-spacing: 2px; text-transform: uppercase; }
  .pill {
    display: inline-block; padding: 10px 26px; border-radius: 999px; background: var(--row);
    box-shadow: inset 0 0 0 2px rgba(245,130,32,.6); font-weight: 700; font-size: 26px; letter-spacing: 3px; text-transform: uppercase;
  }
  .row {
    display: flex; align-items: center; width: 900px; background: var(--row);
    border-left: 6px solid var(--orange); border-radius: 4px; backdrop-filter: blur(2px);
  }
  /* flex, not grid, so a short last row is centred */
  .tgrid { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; width: 936px; margin-top: 34px; }
  .tcard {
    width: var(--w, 300px); height: 196px; padding: 16px 14px 0; background: var(--row); border-radius: 6px; border-top: 5px solid var(--orange);
    display: flex; flex-direction: column; align-items: center; gap: 12px; backdrop-filter: blur(2px);
  }
  .tcard.wild { background: rgba(245,130,32,.12); border: 2px dashed var(--orange); border-top-width: 5px; border-top-style: solid; }
  .tcard.wild .crest { background: var(--orange); color: var(--navy); font-size: 54px; }
  .tcard.wild .tname { color: var(--orange); }
  .tcard .tname span { display: block; font-family: 'Barlow', sans-serif; font-weight: 600; font-size: 15px; letter-spacing: 3px; color: var(--muted); margin-top: 4px; }
  .err { background: #b00020; padding: 30px; font-size: 30px; font-weight: 700; width: 900px; }

  /* matchup: crest / middle / crest */
  .matchup { display: flex; align-items: flex-start; justify-content: center; gap: 40px; width: 1000px; }
  .side { width: 360px; display: flex; flex-direction: column; align-items: center; gap: 26px; }
  .mid { width: 200px; align-self: stretch; display: flex; align-items: center; justify-content: center; }
  .scorers { list-style: none; font-weight: 600; font-size: 24px; letter-spacing: 1px; color: #dfe6f7; line-height: 1.6; text-transform: uppercase; }
  .scorers li::before { content: ''; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--orange); margin: 0 12px 3px 0; }

  /* results / fixtures list */
  .match { height: 96px; margin-bottom: 14px; padding: 0 20px; }
  .many .match { height: 80px; margin-bottom: 10px; }  /* 8+ rows still fit under the header */
  .match .h, .match .a { text-wrap: balance; flex: 1; font-weight: 700; font-size: 28px; line-height: 1.1; letter-spacing: 1px; text-transform: uppercase; }
  .match .h { text-align: right; } .match .a { text-align: left; }
  .match .m { width: 170px; margin: 0 22px; flex: none; }
  .box { display: inline-block; min-width: 130px; padding: 8px 14px 4px; border-radius: 6px; font-family: 'Bebas Neue', sans-serif; font-size: 48px; letter-spacing: 3px; }
  .box.score { background: var(--orange); color: var(--navy); }
  .box.time { box-shadow: inset 0 0 0 2px var(--orange); color: var(--orange); font-size: 34px; padding: 12px 14px 8px; }

  /* points table + scorers */
  .tbl { width: 940px; }
  .tbl .row { width: 100%; height: 62px; margin-bottom: 8px; font-weight: 700; font-size: 26px; }
  .tbl .head { background: none; border-left-color: transparent; backdrop-filter: none; height: 40px; font-size: 18px; letter-spacing: 3px; color: var(--muted); }
  .tbl .pos { width: 70px; text-align: center; font-family: 'Bebas Neue', sans-serif; font-size: 34px; color: var(--orange); }
  .tbl .head .pos { font-family: inherit; font-size: inherit; color: inherit; }
  .tbl .tm { flex: 1; text-align: left; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tbl .n { width: 64px; text-align: center; }
  .tbl .pts { width: 90px; text-align: center; font-family: 'Bebas Neue', sans-serif; font-size: 38px; color: var(--orange); }
  .tbl .head .pts { font-family: inherit; font-size: inherit; color: inherit; }
  .tbl .lead { background: rgba(245,130,32,.18); }
  /* group tables: tighter rows; qualifying places get the orange bar, the rest a faint one */
  .grp .row { height: 54px; margin-bottom: 6px; font-size: 24px; border-left-color: rgba(255,255,255,.12); }
  .grp .row.q { border-left-color: var(--orange); background: rgba(245,130,32,.14); }
  .grp .head { height: 48px; margin-top: 14px; border-left-color: transparent; }
  .grp .pos { color: var(--muted); font-size: 30px; }
  .grp .q .pos { color: var(--orange); }
  .grp .pts { font-size: 34px; }
  /* 3+ groups: squeeze rows so 13 teams + headers fit under the logo */
  .grp.many .row { height: 44px; margin-bottom: 5px; font-size: 21px; }
  .grp.many .head { height: 40px; margin-top: 8px; }
  .grp.many .pos { font-size: 26px; } .grp.many .pts { font-size: 30px; } .grp.many .head .pts { font-size: inherit; } .grp.many .gname { font-size: 34px; }
  .gname { flex: 1; text-align: left; font-family: 'Bebas Neue', sans-serif; font-size: 40px; letter-spacing: 3px; color: var(--orange); }
  .legend { display: flex; align-items: center; gap: 14px; margin-top: 16px; font-weight: 600; font-size: 19px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; }
  .legend i { width: 30px; height: 18px; border-left: 6px solid var(--orange); background: rgba(245,130,32,.25); border-radius: 2px; }
  .tbl .sub { display: block; font-size: 18px; color: var(--muted); letter-spacing: 2px; margin-top: 2px; }
</style>
</head>
<body>
  <svg class="bg" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="glow"><stop offset="0" stop-color="#3b6fd8" stop-opacity=".45"/><stop offset="1" stop-color="#3b6fd8" stop-opacity="0"/></radialGradient>
      <radialGradient id="glowO"><stop offset="0" stop-color="#f58220" stop-opacity=".1"/><stop offset="1" stop-color="#f58220" stop-opacity="0"/></radialGradient>
      <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".6" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <path id="star" d="M0,-1 L.2245,-.309 L.951,-.309 L.363,.118 L.588,.809 L0,.382 L-.588,.809 L-.363,.118 L-.951,-.309 L-.2245,-.309Z"/>
    </defs>
    <circle cx="1000" cy="250" r="520" fill="url(#glow)"/>
    <circle cx="60" cy="1150" r="560" fill="url(#glow)"/>
    <circle cx="540" cy="160" r="420" fill="url(#glowO)"/>
    <g id="swoosh" fill="none" stroke="url(#fade)"></g>
    <g id="stars" fill="#fff"></g>
  </svg>
  <div class="stripe top"></div>
  <header>
    <div class="logo"><img src="../logo.jpg" alt=""></div>
    <div class="league">TAMGHAS SUPER LEAGUE</div>
  </header>
  <main id="main"></main>
  <footer><b>TSL</b> &nbsp;·&nbsp; FUTSAL</footer>
  <div class="stripe bottom"></div>

  <script>
    // Background pattern, same as the team lists.
    const NS = 'http://www.w3.org/2000/svg', swoosh = document.getElementById('swoosh'), stars = document.getElementById('stars');
    for (let i = 0; i < 22; i++) {
      const path = document.createElementNS(NS, 'path'), o = i * 26;
      path.setAttribute('d', `M${-200 + o},1350 C${150 + o},${900 - o} ${500 + o},${500 - o * .6} ${1300},${-50 + o * 1.6}`);
      path.setAttribute('stroke-width', i % 4 ? 1 : 2);
      swoosh.append(path);
    }
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 90; i++) {
      const x = rnd() * 1080, y = rnd() * 1350;
      if (Math.min(x, 1080 - x) >= 150) continue;
      const u = document.createElementNS(NS, 'use'), r = 4 + rnd() * 18;
      u.setAttribute('href', '#star');
      u.setAttribute('transform', `translate(${x} ${y}) scale(${r}) rotate(${rnd() * 72})`);
      u.setAttribute('opacity', (.06 + rnd() * .22).toFixed(2));
      stars.append(u);
    }

    // ---- templates. Each reads URL params; lists use | between items and , between fields. ----
    const q = new URLSearchParams(location.search);
    const get = (k, d = '') => (q.get(k) ?? d).trim();
    const need = k => { const v = get(k); if (!v) throw new Error(`Missing ${k}=`); return v; };
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
    const list = k => get(k).split('|').map(s => s.trim()).filter(Boolean);
    // Codes longer than 3 letters get a smaller font so they stay inside the circle.
    const crest = (t, s = 200) => `<div class="crest" style="--s:${s}px;font-size:${s * .4 * Math.min(1, 3.4 / t.code.length)}px">${esc(t.code)}</div>`;
    // data-fit="W": shrink the font until the text is at most W px wide (see fit() below).
    const big = (text, size, w = 940, cls = '') => `<div class="bebas ${cls}" data-fit="${w}" style="font-size:${size}px"><span>${esc(text)}</span></div>`;
    const scoreParts = s => { const m = s.match(/^(\d+)\s*-\s*(\d+)$/); if (!m) throw new Error(`Score must look like 2-1, got "${s}"`); return [m[1], m[2]]; };

    const T = {
      // Upcoming match. home, away, [match, date, time, venue, label]
      fixture() {
        const h = team(need('home')), a = team(need('away'));
        const info = [get('date'), get('time'), get('venue')].filter(Boolean);
        return `
          <div class="label">${esc(get('label', 'Next Match'))}</div>
          ${get('match') ? big(get('match'), 110, 900) : ''}
          <div class="matchup" style="margin-top:56px">
            <div class="side">${crest(h, 230)}<div class="tname">${esc(h.name)}</div></div>
            <div class="mid" style="height:230px"><div class="bebas" style="font-size:110px;color:var(--orange)">VS</div></div>
            <div class="side">${crest(a, 230)}<div class="tname">${esc(a.name)}</div></div>
          </div>
          <div style="display:flex;gap:16px;margin-top:60px">${info.map(i => `<span class="pill">${esc(i)}</span>`).join('')}</div>`;
      },

      // Goal flash. scorer, team (scoring side), home, away, score (after the goal), [minute]
      goal() {
        const t = team(need('team')), h = team(need('home')), a = team(need('away'));
        const [hg, ag] = scoreParts(need('score'));
        return `
          <div class="bebas" style="font-size:330px;line-height:.8;color:var(--orange);text-shadow:0 12px 50px rgba(245,130,32,.35)">GOAL!</div>
          <div style="margin-top:40px">${big(need('scorer'), 120, 940)}</div>
          <div style="display:flex;align-items:center;gap:20px;margin-top:22px">
            ${crest(t, 64)}<span class="tname" style="font-size:40px">${esc(t.name)}</span>
            ${get('minute') ? `<span class="pill" style="margin-left:6px">${esc(get('minute'))}'</span>` : ''}
          </div>
          <div class="row" style="width:760px;height:120px;margin-top:70px;justify-content:center;gap:34px">
            ${crest(h, 78)}<span class="bebas" style="font-size:96px">${hg}</span>
            <span class="bebas" style="font-size:60px;color:var(--muted)">–</span>
            <span class="bebas" style="font-size:96px">${ag}</span>${crest(a, 78)}
          </div>`;
      },

      // Card / key moment. event (Yellow Card, Red Card, Second Yellow, Penalty Missed, ...), name, team, [minute, home, away, score]
      event() {
        const t = team(need('team')), ev = get('event', 'Yellow Card'), k = ev.toLowerCase();
        const card = (c, r) => `<div style="width:120px;height:170px;border-radius:12px;background:${c};transform:rotate(${r}deg);box-shadow:0 18px 40px rgba(0,0,0,.45)"></div>`;
        const icon = k.includes('second') ? `<div style="display:flex;gap:0">${card('#ffd400', -12)}<div style="margin-left:-40px">${card('#e10600', 8)}</div></div>`
          : k.includes('red') ? card('#e10600', -8) : k.includes('yellow') ? card('#ffd400', -8) : '';
        const colour = k.includes('red') || k.includes('second') ? '#ff4d4d' : k.includes('yellow') ? '#ffd400' : 'var(--orange)';
        const sc = get('score') && get('home') && get('away') ? (() => {
          const h = team(get('home')), a = team(get('away')), [hg, ag] = scoreParts(get('score'));
          return `<div class="row" style="width:760px;height:110px;margin-top:56px;justify-content:center;gap:34px">
            ${crest(h, 72)}<span class="bebas" style="font-size:88px">${hg}</span><span class="bebas" style="font-size:56px;color:var(--muted)">–</span>
            <span class="bebas" style="font-size:88px">${ag}</span>${crest(a, 72)}</div>`; })() : '';
        return `
          ${icon}
          <div class="bebas" style="font-size:${icon ? 150 : 190}px;line-height:.85;margin-top:${icon ? 34 : 0}px;color:${colour};text-shadow:0 10px 40px rgba(0,0,0,.4)">${esc(ev)}</div>
          <div style="margin-top:30px">${big(need('name'), 110, 940)}</div>
          <div style="display:flex;align-items:center;gap:20px;margin-top:20px">
            ${crest(t, 60)}<span class="tname" style="font-size:38px">${esc(t.name)}</span>
            ${get('minute') ? `<span class="pill" style="margin-left:6px">${esc(get('minute'))}'</span>` : ''}
          </div>${sc}`;
      },

      // Half time / full time. home, away, score, [label, homeScorers, awayScorers, homeCards, awayCards, match]
      // Cards: "Y Name 12'" (yellow) or "R Name 30'" (red).
      score() {
        const h = team(need('home')), a = team(need('away'));
        const [hg, ag] = scoreParts(need('score'));
        const cardIcon = c => `<i style="display:inline-block;width:14px;height:20px;border-radius:3px;margin-right:8px;vertical-align:-2px;background:${c === 'R' ? '#e10600' : '#ffd400'}"></i>`;
        const sc = (k, c) => `<ul class="scorers">${list(k).map(s => `<li>${esc(s)}</li>`).join('')}
          ${list(c).map(s => `<li style="opacity:.85">${cardIcon(s[0])}${esc(s.slice(2))}</li>`).join('')}</ul>`;
        return `
          ${get('match') ? `<div class="label">${esc(get('match'))}</div>` : ''}
          ${big(get('label', 'Full Time'), 150, 940)}
          <div class="matchup" style="margin-top:50px">
            <div class="side">${crest(h, 200)}<div class="tname">${esc(h.name)}</div>${sc('homeScorers', 'homeCards')}</div>
            <div class="mid" style="height:200px"><div class="bebas" style="font-size:150px;white-space:nowrap">${hg}<span style="color:var(--orange)"> - </span>${ag}</div></div>
            <div class="side">${crest(a, 200)}<div class="tname">${esc(a.name)}</div>${sc('awayScorers', 'awayCards')}</div>
          </div>`;
      },

      // Day's fixtures or results. matches="Home,Away,2-1|Home,Away,4:00 PM", [title, subtitle]
      results() {
        const rows = list('matches').map(m => {
          const [h, a, mid = ''] = m.split(',').map(s => s.trim());
          const isScore = /^\d+\s*-\s*\d+$/.test(mid);
          return `<div class="row match">
            <span class="h">${esc(team(h).name)}</span>
            <span class="m"><span class="box ${isScore ? 'score' : 'time'}">${esc(isScore ? mid.replace(/\s*-\s*/, ' - ') : mid || 'VS')}</span></span>
            <span class="a">${esc(team(a).name)}</span></div>`;
        });
        if (!rows.length) throw new Error('Missing matches=');
        return `
          ${get('subtitle') ? `<div class="label">${esc(get('subtitle'))}</div>` : ''}
          ${big(get('title', 'Results'), 120, 900)}
          <div style="margin-top:40px" class="${rows.length > 7 ? 'many' : ''}">${rows.join('')}</div>`;
      },

      // Points table, computed from results ("Home 2-1 Away" lines; make.py fills it from results.txt).
      // With groups= (make.py fills it from groups.txt): one table per group, top `qualify` rows marked.
      table() {
        const cols = ['p', 'w', 'd', 'l', 'gd'];
        if (get('groups')) {
          const n = +get('qualify', '2'), next = get('next', 'Quarter-Finals');
          const groups = groupTables(parseResults(get('results')), parseGroups(get('groups')));
          return `
            ${big(get('title', 'Points Table'), groups.length > 2 ? 70 : 84, 900)}
            ${get('subtitle') ? `<div class="label" style="margin-top:8px">${esc(get('subtitle'))}</div>` : ''}
            <div class="tbl grp ${groups.length > 2 ? 'many' : ''}" style="margin-top:${groups.length > 2 ? 4 : 14}px">
              ${groups.map(g => `
                <div class="row head"><span class="gname">${esc(g.name)}</span>${cols.map(c => `<span class="n">${c.toUpperCase()}</span>`).join('')}<span class="pts">PTS</span></div>
                ${g.rows.map((r, i) => `<div class="row ${i < n ? 'q' : ''}"><span class="pos">${i + 1}</span><span class="tm">${esc(r.team.name)}</span>
                  ${cols.map(c => `<span class="n">${c === 'gd' && r.gd > 0 ? '+' : ''}${r[c]}</span>`).join('')}<span class="pts">${r.pts}</span></div>`).join('')}`).join('')}
            </div>
            <div class="legend"><i></i>Top ${n} from each group qualify for the ${esc(next)}</div>`;
        }
        const rows = table(parseResults(get('results')));
        return `
          ${big(get('title', 'Points Table'), 96, 900)}
          ${get('subtitle') ? `<div class="label" style="margin-top:10px">${esc(get('subtitle'))}</div>` : ''}
          <div class="tbl" style="margin-top:26px">
            <div class="row head"><span class="pos">#</span><span class="tm">TEAM</span>${cols.map(c => `<span class="n">${c.toUpperCase()}</span>`).join('')}<span class="pts">PTS</span></div>
            ${rows.map((r, i) => `<div class="row ${!i && r.pts ? 'lead' : ''}"><span class="pos">${i + 1}</span><span class="tm">${esc(r.team.name)}</span>
              ${cols.map(c => `<span class="n">${c === 'gd' && r.gd > 0 ? '+' : ''}${r[c]}</span>`).join('')}<span class="pts">${r.pts}</span></div>`).join('')}
          </div>`;
      },

      // Player of the match. name, team, [match, stat]
      motm() {
        const t = team(need('team'));
        return `
          <svg viewBox="-1 -1 2 2" style="position:absolute;width:640px;opacity:.1;top:50%;left:50%;transform:translate(-50%,-55%)"><use href="#star" fill="#f58220"/></svg>
          <div class="label" style="position:relative">Player of the Match</div>
          <div style="position:relative;margin-top:50px">${big(need('name'), 170, 940)}</div>
          ${get('stat') ? `<div class="bebas" style="position:relative;font-size:70px;color:var(--orange);margin-top:20px">${esc(get('stat'))}</div>` : ''}
          <div style="position:relative;display:flex;align-items:center;gap:20px;margin-top:44px">${crest(t, 80)}<span class="tname" style="font-size:46px">${esc(t.name)}</span></div>
          ${get('match') ? `<div class="pill" style="position:relative;margin-top:60px">${esc(get('match'))}</div>` : ''}`;
      },

      // Top scorers. players="Name,Team,Goals|...", [title, subtitle]
      scorers() {
        const ps = list('players').map(p => { const [name, t, g] = p.split(',').map(s => s.trim()); return { name, team: team(t), g: +g }; })
          .sort((x, y) => y.g - x.g || x.name.localeCompare(y.name));
        if (!ps.length) throw new Error('Missing players=');
        let rank = 0;
        return `
          ${big(get('title', 'Top Scorers'), 110, 900)}
          ${get('subtitle') ? `<div class="label" style="margin-top:10px">${esc(get('subtitle'))}</div>` : ''}
          <div class="tbl" style="margin-top:36px">
            ${ps.slice(0, 12).map((p, i) => { if (!i || p.g !== ps[i - 1].g) rank = i + 1;
              return `<div class="row ${i ? '' : 'lead'}" style="height:${ps.length > 10 ? 66 : 78}px"><span class="pos">${rank}</span>
                <span class="tm">${esc(p.name)}<span class="sub">${esc(p.team.name)}</span></span>
                <span class="pts" style="width:130px;font-size:50px">${p.g}</span></div>`; }).join('')}
          </div>`;
      },

      // All teams, alphabetical, plus open wildcard slots. [wildcards=1, title, subtitle]
      teams() {
        const ts = [...TEAMS].sort((a, b) => a.name.localeCompare(b.name));
        // More than 12 cards don't fit in 3 columns, so go to 4 narrower ones.
        const four = ts.length + +get('wildcards', '0') > 12;
        const card = (c, name, wild) => `<div class="tcard ${wild ? 'wild' : ''}" style="--w:${four ? 220 : 300}px">${c}<div class="tname" style="font-size:${four ? 28 : 32}px">${name}</div></div>`;
        return `
          ${get('subtitle') ? `<div class="label">${esc(get('subtitle'))}</div>` : ''}
          ${big(get('title', 'The Teams'), four ? 90 : 110, 900)}
          <div class="tgrid">
            ${ts.map(t => card(crest(t, 84), esc(t.name))).join('')}
            ${Array.from({ length: +get('wildcards', '0') }, () => card('<div class="crest" style="--s:84px">?</div>', 'Wildcard Entry<span>To be announced</span>', true)).join('')}
          </div>`;
      },

      // Winners. team, [label, season]
      champions() {
        const t = team(need('team'));
        return `
          ${get('season') ? `<div class="label">${esc(get('season'))}</div>` : ''}
          <div class="bebas" style="font-size:190px;margin-top:20px;color:var(--orange);text-shadow:0 12px 50px rgba(245,130,32,.35)">${esc(get('label', 'Champions'))}</div>
          <div style="margin-top:50px">${crest(t, 280)}</div>
          <div style="margin-top:50px">${big(t.name, 120, 940)}</div>`;
      },

      // Tournament format explainer. [groups="4,3,3,3" (teams per group), label]
      // Top 2 of each group go to quarter-finals; the bracket keeps group-mates apart until the final.
      format() {
        // groups= is either sizes ("4,3,3,3") or groups.txt text, which puts the drawn teams in the slots
        const g = get('groups', '4,3,3,3'), named = /[a-z]/i.test(g) ? parseGroups(g) : null;
        const sizes = named ? named.map(x => x.teams.length) : g.split(',').map(Number), L = 'ABCD';
        if (sizes.length !== 4) throw new Error('format expects 4 groups (quarter-final bracket)');
        const rr = n => n * (n - 1) / 2, groupGames = sizes.reduce((s, n) => s + rr(n), 0);
        // Which quarter-final each qualifying slot goes to: QF1 A1-B2, QF2 C1-D2, QF3 B1-A2, QF4 D1-C2
        const QF = [['A1', 'B2'], ['C1', 'D2'], ['B1', 'A2'], ['D1', 'C2']];
        const qfOf = slot => QF.findIndex(m => m.includes(slot)) + 1;
        const word = { 1: 'Winner', 2: 'Runner-up' }, ord = ['1st', '2nd', '3rd', '4th'];
        const slotRow = (g, pos) => {
          const q = pos <= 2, slot = `${g}${pos}`;
          return `<div style="display:flex;align-items:center;gap:10px;height:42px;padding:0 10px;border-radius:4px;
            ${q ? 'background:rgba(245,130,32,.2);box-shadow:inset 4px 0 0 var(--orange)' : 'background:rgba(255,255,255,.04);opacity:.55'}">
            <span class="bebas" style="font-size:28px;width:34px;text-align:left;${q ? 'color:var(--orange)' : ''}">${slot}</span>
            <span style="flex:1;text-align:left;font-weight:700;font-size:14px;letter-spacing:2px;text-transform:uppercase">${ord[pos - 1]}</span>
            ${q ? `<span style="font-weight:700;font-size:13px;letter-spacing:1px;color:var(--navy);background:var(--orange);border-radius:3px;padding:3px 6px">QF${qfOf(slot)}</span>` : ''}
          </div>`;
        };
        const teamRow = t => `<div style="display:flex;align-items:center;gap:8px;height:46px;padding:0 6px;border-radius:4px;background:rgba(255,255,255,.06)">
          ${crest(t, 34)}<span style="flex:1;text-align:left;font-weight:700;font-size:14px;line-height:1.1;text-transform:uppercase">${esc(t.name)}</span></div>`;
        const box = (top, sub, hl) => `<div class="row" style="height:64px;width:100%;padding:0 14px;justify-content:center;flex-direction:column;
          ${hl ? 'background:var(--orange);color:var(--navy);border-left-color:#fff' : ''}">
          <span class="bebas" style="font-size:32px">${top}</span>${sub ? `<span style="font-weight:700;font-size:13px;letter-spacing:2px;color:${hl ? 'var(--navy)' : 'var(--muted)'};text-transform:uppercase">${sub}</span>` : ''}</div>`;
        const col = (title, items, flex = 1) => `<div style="flex:${flex};display:flex;flex-direction:column;gap:8px">
          <div style="font-weight:700;font-size:17px;letter-spacing:5px;color:var(--orange)">${title}</div>
          <div style="flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:10px">${items.join('')}</div></div>`;
        const qfBox = ([h, a], k) => box(`${h} vs ${a}`, `QF${k + 1} · ${word[h[1]]} ${h[0]} v ${word[a[1]]} ${a[0]}`);
        return `
          <div class="label">${esc(get('label', 'Tournament Format'))}</div>
          <div class="bebas" style="font-size:80px;margin-top:6px">${sizes.reduce((a, b) => a + b)} Teams · ${sizes.length} Groups · ${groupGames + 7} Matches</div>
          <div style="display:flex;gap:14px;width:960px;margin-top:22px;align-items:stretch">${sizes.map((n, i) => `
            <div class="row" style="flex:1;height:auto;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:6px;padding:14px 10px">
              <span class="bebas" style="font-size:40px;color:var(--orange)">Group ${L[i]}</span>
              <span style="font-weight:600;font-size:14px;letter-spacing:2px;color:var(--muted);margin-bottom:4px">${n} TEAMS · ${rr(n)} MATCHES</span>
              ${named ? named[i].teams.map(teamRow).join('') + `<div style="margin-top:auto;padding-top:6px;font-weight:700;font-size:12px;letter-spacing:1px;color:var(--orange)">
                ${L[i]}1 → QF${qfOf(L[i] + 1)} · ${L[i]}2 → QF${qfOf(L[i] + 2)}</div>`
                : Array.from({ length: n }, (_, p) => slotRow(L[i], p + 1)).join('')}</div>`).join('')}</div>
          <div style="display:flex;align-items:center;gap:12px;margin-top:16px;font-weight:600;font-size:19px;letter-spacing:2px;color:#dfe6f7">
            <span style="width:22px;height:22px;border-radius:4px;background:rgba(245,130,32,.45);box-shadow:inset 4px 0 0 var(--orange)"></span>
            Top 2 of each group qualify for the Quarter-Finals</div>
          <div style="display:flex;gap:16px;width:960px;height:320px;margin-top:26px;text-align:center">
            ${col('QUARTER-FINALS', QF.map(qfBox), 1.25)}
            ${col('SEMI-FINALS', [box('W QF1 vs W QF2', 'SF1'), box('W QF3 vs W QF4', 'SF2')])}
            ${col('FINAL', [box('W SF1 vs W SF2', 'Champion', true)], .9)}
          </div>
          <div style="display:flex;gap:12px;margin-top:24px">
            <span class="pill">Win 3 · Draw 1</span><span class="pill">Tie: H2H, then Shootout</span>
          </div>`;
      },

      // Group-stage order (make.py fills fixtures= from fixtures.txt: "Group, Home v Away[, time]" lines). [title, subtitle]
      fixtures() {
        const ms = get('fixtures', '').split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#')).map(l => {
          const [g, vs, time = ''] = l.split(',').map(s => s.trim()), [h, a] = vs.split(/\s+v\s+/);
          return { g, h: team(h), a: team(a), time };
        });
        if (!ms.length) throw new Error('Missing fixtures=');
        const side = (t, right) => `<span style="flex:1;display:flex;align-items:center;gap:10px;${right ? 'flex-direction:row-reverse;text-align:right' : 'text-align:left'}">
          ${crest(t, 36)}<span style="font-weight:700;font-size:19px;letter-spacing:1px;text-transform:uppercase">${esc(t.name)}</span></span>`;
        return `
          ${big(get('title', 'Group Stage Fixtures'), 84, 940)}
          ${get('subtitle') ? `<div class="label" style="margin-top:8px">${esc(get('subtitle'))}</div>` : ''}
          <div style="width:960px;margin-top:20px;display:flex;flex-direction:column;gap:6px">${ms.map((m, i) => `
            <div class="row" style="height:48px;padding:0 14px;gap:12px">
              <span class="bebas" style="width:44px;text-align:left;font-size:28px;color:var(--orange)">${String(i + 1).padStart(2, '0')}</span>
              <span style="width:28px;font-weight:700;font-size:14px;color:var(--navy);background:var(--orange);border-radius:3px;padding:3px 0">${esc(m.g)}</span>
              ${side(m.h)}<span class="bebas" style="width:90px;font-size:${m.time ? 24 : 26}px;color:var(--muted)">${esc(m.time || 'VS')}</span>${side(m.a, true)}
            </div>`).join('')}</div>`;
      },

      // Announcement. title, [label, date, time, venue, body, sign]
      // Extras: logo2 (image path, e.g. ../14starlogo.jpg), sub (line under the title),
      // rows="Date=Sat|Kick-off=7 AM" (replaces date/time/venue), pill, qr (link to encode, e.g. a Facebook page).
      notice() {
        const info = get('rows') ? list('rows').map(r => r.split('=').map(s => s.trim()))
          : [['Date', get('date')], ['Time', get('time')], ['Venue', get('venue')]].filter(([, v]) => v);
        const extra = get('logo2') || get('qr'), rowH = extra ? 74 : 96;
        let qr = '';
        if (get('qr') && window.qrcode) { const q = qrcode(0, 'M'); q.addData(get('qr')); q.make(); qr = q.createSvgTag({ scalable: true, margin: 2 }); }
        const rows = `<div style="flex:1;min-width:0">${info.map(([k, v]) => `
            <div class="row" style="width:100%;height:${rowH}px;margin-bottom:10px;padding:0 28px">
              <span style="width:${extra ? 150 : 170}px;text-align:left;font-weight:700;font-size:${extra ? 19 : 22}px;letter-spacing:4px;color:var(--orange);text-transform:uppercase">${esc(k)}</span>
              <span class="bebas" style="flex:1;text-align:left;font-size:${extra ? 42 : 54}px">${esc(v)}</span>
            </div>`).join('')}</div>`;
        return `
          ${get('logo2') ? `<div class="logo" style="width:190px;height:190px;padding:5px;box-shadow:0 0 0 8px var(--orange),0 20px 50px rgba(0,0,0,.5)"><img src="${esc(get('logo2'))}" alt=""></div>` : ''}
          <div class="label" style="margin-top:${get('logo2') ? 30 : 0}px">${esc(get('label', 'Official Notice'))}</div>
          <div style="margin-top:${extra ? 8 : 20}px">${big(need('title'), extra ? 120 : 150, 940)}</div>
          ${get('sub') ? `<div style="margin-top:6px;font-weight:700;font-size:30px;letter-spacing:2px;color:var(--orange)">${esc(get('sub'))}</div>` : ''}
          ${get('body') ? `<div style="width:900px;margin-top:${extra ? 18 : 40}px;font-weight:600;font-size:${extra ? 25 : 31}px;line-height:1.4;color:#dfe6f7;text-wrap:balance">${esc(get('body'))}</div>` : ''}
          <div style="display:flex;gap:22px;align-items:center;width:940px;margin-top:${extra ? 24 : 46}px">
            ${rows}
            ${qr ? `<div style="flex:none;width:236px;text-align:center"><div style="background:#fff;border-radius:10px;padding:8px;box-shadow:0 0 0 5px var(--orange)">${qr}</div>
              <div style="margin-top:12px;font-weight:700;font-size:16px;letter-spacing:4px;color:var(--muted)">SCAN TO FOLLOW</div></div>` : ''}
          </div>
          ${get('pill') ? `<div class="pill" style="margin-top:18px;background:var(--orange);color:var(--navy);border-color:var(--orange)">${esc(get('pill'))}</div>` : ''}
          ${get('sign') ? `<div style="margin-top:34px;font-weight:700;font-size:22px;letter-spacing:6px;color:var(--muted);text-transform:uppercase">— ${esc(get('sign'))}</div>` : ''}`;
      },
    };

    const main = document.getElementById('main');
    try {
      const type = get('type');
      if (!T[type]) throw new Error(`type= must be one of: ${Object.keys(T).join(', ')}`);
      main.innerHTML = T[type]();
    } catch (e) {
      main.innerHTML = `<div class="err">${esc(e.message)}</div>`;
    }

    // Shrink long text to fit once the web fonts have loaded.
    document.fonts.ready.then(() => {
      for (const el of document.querySelectorAll('[data-fit]')) {
        const span = el.firstElementChild, max = +el.dataset.fit;
        for (let size = parseFloat(el.style.fontSize); span.offsetWidth > max && size > 30; size -= 2) el.style.fontSize = size + 'px';
      }
    });
  </script>
</body>
</html>
