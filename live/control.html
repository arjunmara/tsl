<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>TSL Scoreboard Control</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --navy: #0a1a3f; --navy-2: #12285c; --orange: #f58220; --muted: #9fb0d6; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; padding: 16px; background: var(--navy); color: #fff; font-family: 'Barlow', sans-serif; }
  h2 { margin: 22px 0 8px; font-size: 13px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; }
  button, select { font: inherit; font-weight: 700; color: #fff; background: var(--navy-2); border: 0; border-radius: 10px; padding: 14px; }
  button:active { filter: brightness(1.4); }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; min-width: 0; }
  .bebas { font-family: 'Bebas Neue', sans-serif; letter-spacing: 2px; }

  .live { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-radius: 12px;
    background: var(--navy-2); border-left: 4px solid var(--orange); }
  .live .sc { font-size: 44px; }
  .live .tm { text-align: right; }
  .live .tm b { display: block; font-size: 32px; font-weight: 400; }
  .live .tm span { font-size: 12px; letter-spacing: 2px; color: var(--orange); text-transform: uppercase; }
  .off { color: var(--muted); }

  .side { text-align: center; }
  .side .name { min-height: 40px; font-weight: 700; font-size: 15px; letter-spacing: 1px; text-transform: uppercase; }
  .plus { width: 100%; height: 110px; font-size: 64px; background: var(--orange); color: var(--navy); }
  .minus { width: 100%; margin-top: 8px; padding: 8px; font-size: 14px; color: var(--muted); }
  .start { background: #1e8e3e; }
  .start.running { background: #b00020; }
  .on { background: var(--orange); color: var(--navy); }
  select { width: 100%; }
  .kit { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .kit button { width: 38px; height: 38px; padding: 0; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); }
  .kit button.on { outline: 3px solid var(--orange); outline-offset: 2px; }
  .kit input { width: 38px; height: 38px; padding: 0; border: 0; border-radius: 50%; background: none; }
  .ads { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .ads button { padding: 6px; font-size: 12px; display: flex; flex-direction: column; gap: 4px; align-items: center; }
  .ads img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; }
  .ads button.on { outline: 3px solid var(--orange); }
  .err { display: none; margin-bottom: 12px; padding: 10px; border-radius: 8px; background: #b00020; font-weight: 700; }
</style>
</head>
<body>
<div class="err" id="err"></div>
<button id="who" style="width:100%;margin-bottom:12px">Sign in to control the scoreboard</button>
<dialog id="login" style="background:var(--navy-2);color:#fff;border:0;border-radius:12px;width:min(340px,90vw)">
  <form id="loginform">
    <h2 style="margin-top:0">Organiser sign-in</h2>
    <input name="email" type="email" placeholder="Email" autocomplete="username" required style="width:100%;margin-bottom:8px;padding:12px;font:inherit">
    <input name="password" type="password" placeholder="Password" autocomplete="current-password" required style="width:100%;margin-bottom:8px;padding:12px;font:inherit">
    <div id="loginmsg" style="color:#ff6b6b;font-weight:700"></div>
    <div class="row"><button class="on">Sign in</button><button type="button" onclick="$('login').close()">Cancel</button></div>
  </form>
</dialog>

<div class="live">
  <div class="sc bebas" id="sc"></div>
  <div class="tm"><b class="bebas" id="time"></b><span id="per"></span></div>
</div>

<h2>Score</h2>
<div class="row">
  <div class="side"><div class="name" id="hn"></div><button class="plus bebas" onclick="add('hs', 1)">+1</button><button class="minus" onclick="add('hs', -1)">Undo −1</button></div>
  <div class="side"><div class="name" id="an"></div><button class="plus bebas" onclick="add('as', 1)">+1</button><button class="minus" onclick="add('as', -1)">Undo −1</button></div>
</div>

<h2>Kit colours</h2>
<div class="row"><div class="kit" id="hkit"></div><div class="kit" id="akit"></div></div>

<h2>Clock</h2>
<div class="row"><button class="start" id="start" onclick="send({clock: s.running ? 'stop' : 'start'})">Start</button></div>
<div class="row" style="margin-top:8px">
  <button onclick="send({clock: s.clock - 10})">−10s</button>
  <button onclick="send({clock: s.clock + 10})">+10s</button>
  <button onclick="confirm('Reset clock to 00:00?') && send({clock: 'reset'})">Reset</button>
</div>

<h2>Period</h2>
<div class="row" id="periods"></div>

<h2>On air</h2>
<div class="row" id="scenes"></div>
<div class="row" style="margin-top:8px"><button id="show" onclick="send({show: !s.show})"></button></div>

<h2>Sponsors</h2>
<div class="row"><button id="tick" onclick="send({ticker: !s.ticker})"></button></div>
<div class="ads" id="ads"></div>
<div class="row" style="margin-top:8px"><button id="adoff" onclick="send({ad: null})">Hide ad now</button></div>

<h2>New match</h2>
<div class="row"><select id="fx"></select></div>
<div class="row" style="margin-top:8px"><select id="home"></select><select id="away"></select></div>
<div class="row" style="margin-top:8px"><button onclick="newMatch()">Start new match (0-0, clock 00:00)</button></div>

<script src="../matchday/league.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="../firebase-config.js"></script>
<script src="live.js?v=4"></script>
<script>
  const $ = id => document.getElementById(id);
  const PERIODS = ['1st Half', 'Half Time', '2nd Half', 'Full Time', 'Penalties'];
  let s = {};

  // Scenes on the stream. Auto: score bug in play, Break screen at Half Time / Full Time.
  const SCENES = [['auto', 'Auto'], ['soon', 'Starting Soon'], ['match', 'Score bug'], ['break', 'Break']];
  $('scenes').style.flexWrap = 'wrap';
  $('scenes').innerHTML = SCENES.map(([k, l]) => `<button style="flex-basis:45%" data-scene="${k}" onclick="send({scene: '${k}'})">${l}</button>`).join('');
  $('periods').style.flexWrap = 'wrap';
  $('periods').innerHTML = PERIODS.map(p => `<button style="flex-basis:30%" onclick="send({period: '${p}'})">${p}</button>`).join('');
  const opts = TEAMS.map(t => `<option>${t.name}</option>`).join('');
  $('home').innerHTML = $('away').innerHTML = opts;

  function render(next) {
    s = next;
    const t = Math.floor(s.clock);
    $('sc').textContent = `${team(s.home).code} ${s.hs} - ${s.as} ${team(s.away).code}`;
    $('time').textContent = `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;
    $('time').classList.toggle('off', !s.running);
    $('per').textContent = s.period;
    $('hn').textContent = s.home;
    $('an').textContent = s.away;
    $('start').textContent = s.running ? 'Stop clock' : 'Start clock';
    $('start').classList.toggle('running', s.running);
    $('show').textContent = s.show ? 'Score bug showing — tap to hide' : 'Score bug hidden — tap to show';
    [...$('scenes').children].forEach(b => b.classList.toggle('on', b.dataset.scene === (s.scene || 'auto')));
    $('show').classList.toggle('on', s.show);
    [...$('periods').children].forEach(b => b.classList.toggle('on', b.textContent === s.period));
    renderKits();
    $('tick').textContent = s.ticker ? 'Sponsor ticker showing — tap to hide' : 'Sponsor ticker hidden — tap to show';
    $('tick').classList.toggle('on', s.ticker);
    const live = s.ad && s.ad.until > serverNow();
    [...$('ads').children].forEach(b => b.classList.toggle('on', !!live && b.dataset.src === s.ad.src));
    $('adoff').hidden = !live;
  }

  // Sponsor ads: tap one to pop it over the stream for 10 seconds (tap again to restart the 10 s).
  const AD_SECONDS = 10;
  loadSponsors().then(sp => $('ads').innerHTML = sp.filter(x => x.ad).map(x =>
    `<button data-src="${x.ad}" onclick="send({ad: {src: this.dataset.src, until: serverNow() + ${AD_SECONDS * 1000}}})"><img src="${x.ad}" alt="" loading="lazy">${x.name === '-' ? 'Image' : x.name}</button>`).join('')
    || '<p style="color:var(--muted);grid-column:1/-1">No ads yet — add them to Sponsors/sponsors.txt.</p>');

  // Writes go to Firebase (organiser only); every screen showing the overlay updates within a second.
  const auth = firebase.auth();
  let user = null;
  auth.onAuthStateChanged(u => { user = u; $('who').textContent = u ? `Signed in ✓ (${u.email}) — tap to sign out` : 'Sign in to control the scoreboard'; });
  $('who').onclick = () => user ? confirm('Sign out?') && auth.signOut() : $('login').showModal();
  $('loginform').onsubmit = e => {
    e.preventDefault();
    auth.signInWithEmailAndPassword(e.target.email.value.trim(), e.target.password.value)
      .then(() => $('login').close()).catch(err => $('loginmsg').textContent = err.message);
  };
  let offline;  // only warn after a few seconds: every page load starts "disconnected" for a moment
  firebase.database().ref('.info/connected').on('value', c => {
    clearTimeout(offline);
    if (c.val()) return $('err').style.display = 'none';
    offline = setTimeout(() => { $('err').textContent = 'No connection — changes will send when the signal is back.'; $('err').style.display = 'block'; }, 4000);
  });
  function send(patch) {
    if (!user) return $('login').showModal();
    return patchLive(s, patch).catch(e => { $('err').textContent = e.message; $('err').style.display = 'block'; });
  }

  // Pick the match from the fixtures list (same list as the phone maker).
  const fixtures = text => text.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#')).map((l, i) => {
    const [g, vs, time = ''] = l.split(',').map(x => x.trim()), [h, a] = vs.split(/\s+v\s+/);
    return { n: i + 1, home: team(h).name, away: team(a).name, time };
  });
  firebase.database().ref('tsl/fixtures').on('value', snap => {
    (snap.val() ? Promise.resolve(snap.val()) : fetch('../matchday/fixtures.txt').then(r => r.text())).then(t => {
      const fx = fixtures(t);
      $('fx').innerHTML = '<option value="">Pick from fixtures…</option>' + fx.map(m => `<option value="${m.home}|${m.away}">${m.n}. ${m.time} · ${team(m.home).code} v ${team(m.away).code}</option>`).join('');
    });
  });
  $('fx').onchange = () => { if ($('fx').value) [$('home').value, $('away').value] = $('fx').value.split('|'); };
  const add = (k, n) => send({ [k]: s[k] + n });

  function newMatch() {
    const home = $('home').value, away = $('away').value;
    if (home === away) return alert('Pick two different teams.');
    if (confirm(`New match: ${home} vs ${away}?\nScore and clock go back to zero.`))
      send({ home, away, hs: 0, as: 0, clock: 'reset', period: '1st Half', scene: 'soon', hc: kits[team(home).code] || '', ac: kits[team(away).code] || '' });
  }

  // Kit colours: tap a swatch (or the picker for any colour). Each team's last colour is remembered for its next match.
  const KIT = ['#d71920', '#1f4fd8', '#6cc3f0', '#ffffff', '#111111', '#ffd400', '#1e9e3e', '#f58220', '#7a1f3d', '#6a2fb5'];
  const kitsRef = firebase.database().ref('tsl/kits');
  let kits = {};
  kitsRef.on('value', snap => { kits = snap.val() || {}; });
  let kitKey;
  function renderKits() {
    const key = [s.home, s.away, s.hc, s.ac].join('|');
    if (key === kitKey) return;  // the clock re-renders 4x a second; rebuilding would close an open colour picker
    kitKey = key;
    for (const [side, key, name] of [['hkit', 'hc', s.home], ['akit', 'ac', s.away]]) {
      $(side).innerHTML = KIT.map(c => `<button style="background:${c}" class="${s[key] === c ? 'on' : ''}" aria-label="${c}" onclick="kit('${key}', '${c}')"></button>`).join('')
        + `<input type="color" value="${s[key] || '#ffffff'}" aria-label="Any colour" onchange="kit('${key}', this.value)">`;
    }
  }
  function kit(key, c) {
    if (!user) return $('login').showModal();
    send({ [key]: c });
    kitsRef.child(team(key === 'hc' ? s.home : s.away).code).set(c);
  }

  onLive(render);
</script>
</body>
</html>
