<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TSL Live Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* OBS browser source or PRISM web widget, transparent background. The score bug sits top-left in a 1920x1080 #stage
     scaled to the widget; the Starting Soon / Break scenes (screen.html) fill the whole widget and fade in when the
     scorer's control page picks them (or automatically at Half Time / Full Time). */
  :root { --navy: #0a1a3f; --navy-2: #12285c; --orange: #f58220; --muted: #9fb0d6; }
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: 'Barlow', sans-serif; color: #fff; }
  #stage { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; }
  .wrap { position: absolute; top: 48px; left: 64px; transform-origin: top left; transition: opacity .4s, transform .4s; }
  body.bug-only #stage { width: 720px; height: 165px; }
  body.bug-only .wrap { top: 12px; left: 8px; }
  .scene { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; opacity: 0; transition: opacity .6s; pointer-events: none; }
  .scene.on { opacity: 1; }
  .wrap.hidden { opacity: 0; transform: translateY(-20px); }

  .bug { display: flex; align-items: stretch; height: 72px; filter: drop-shadow(0 6px 18px rgba(0,0,0,.45)); }
  .logo { width: 92px; height: 92px; margin: -10px -22px 0 0; border-radius: 50%; border: 4px solid var(--orange);
    box-sizing: border-box; background: var(--navy); position: relative; z-index: 2; overflow: hidden; }
  .logo img { width: 100%; height: 100%; display: block; }
  .bebas { font-family: 'Bebas Neue', sans-serif; line-height: 1; letter-spacing: 2px; display: flex; align-items: center; justify-content: center; }
  .team { width: 150px; padding-top: 4px; font-size: 46px; background: var(--navy); }
  .team.home { padding-left: 22px; border-radius: 6px 0 0 6px; }
  .score { width: 160px; padding-top: 4px; font-size: 56px; background: var(--orange); color: var(--navy); gap: 14px; }
  .score i { font-style: normal; font-size: 36px; opacity: .6; }
  .clock { flex-direction: column; width: 150px; background: var(--navy-2); border-radius: 0 6px 6px 0; }
  .clock b { font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 44px; line-height: .9; padding-top: 4px; font-variant-numeric: tabular-nums; }
  .clock span { font-weight: 700; font-size: 14px; letter-spacing: 3px; color: var(--orange); text-transform: uppercase; }
  .clock.stopped b { color: var(--muted); }

  /* Goal flash, slides out under the bug for a few seconds when a score goes up. */
  .goal { margin: 10px 0 0 70px; height: 0; overflow: hidden; display: flex; align-items: stretch; transition: height .35s; }
  .goal.on { height: 58px; }
  .goal .tag { padding: 6px 22px 0; font-size: 40px; background: var(--orange); color: var(--navy); border-radius: 6px 0 0 6px; }
  .goal .who { padding: 0 26px; font-weight: 700; font-size: 26px; letter-spacing: 4px; text-transform: uppercase;
    background: var(--navy); border-radius: 0 6px 6px 0; display: flex; align-items: center; }
</style>
</head>
<body>
<div id="stage">
<div class="wrap" id="wrap">
  <div class="bug">
    <div class="logo"><img src="../logo.jpg" alt=""></div>
    <div class="team home bebas" id="home"></div>
    <div class="score bebas"><span id="hs"></span><i>-</i><span id="as"></span></div>
    <div class="team bebas" id="away"></div>
    <div class="clock bebas" id="clock"><b id="time"></b><span id="period"></span></div>
  </div>
  <div class="goal" id="goal"><div class="tag bebas">Goal</div><div class="who" id="who"></div></div>
</div>
</div>
<script src="../matchday/league.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="../firebase-config.js"></script>
<script src="live.js?v=3"></script>
<script>
  const $ = id => document.getElementById(id);
  const code = name => { try { return team(name).code; } catch { return name; } };
  let last, goalTimer;

  // Which scene is on air: the control page's choice, or in "auto" the period decides.
  const sceneOf = s => s.scene && s.scene !== 'auto' ? s.scene : /Half Time|Full Time/.test(s.period) ? 'break' : 'match';

  function render(s) {
    const scene = sceneOf(s);
    document.querySelectorAll('.scene').forEach(f => f.classList.toggle('on', f.dataset.scene === scene));
    $('wrap').classList.toggle('hidden', !s.show || scene !== 'match');
    $('home').textContent = code(s.home);
    $('home').style.boxShadow = s.hc ? `inset 0 -8px 0 ${s.hc}` : '';  // kit colour bar under each team
    $('away').style.boxShadow = s.ac ? `inset 0 -8px 0 ${s.ac}` : '';
    $('away').textContent = code(s.away);
    $('hs').textContent = s.hs;
    $('as').textContent = s.as;
    const t = Math.floor(s.clock);
    $('time').textContent = `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;
    $('clock').classList.toggle('stopped', !s.running);
    $('period').textContent = s.period;
    // Only flash for a +1 in the same match, not when teams are switched or a score is corrected down.
    if (last && last.home === s.home && last.away === s.away && scene === 'match') {
      if (s.hs > last.hs) goal(s.home);
      else if (s.as > last.as) goal(s.away);
    }
    last = s;
  }

  function goal(name) {
    $('who').textContent = name;
    $('goal').classList.add('on');
    clearTimeout(goalTimer);
    goalTimer = setTimeout(() => $('goal').classList.remove('on'), 7000);
  }

  // Live from Firebase; if the connection drops, the last frame just stays on screen.
  // ?bug=1: just the score bug, filling the widget (for PRISM-style web widgets you drag/resize yourself).
  // Tuning knobs for apps that size the widget their own way: &zoom=1.3 (bigger/smaller), &stretch=1 (fill the box exactly).
  const q = new URLSearchParams(location.search);
  if (q.has('bug')) {  // a small widget can't hold the full-screen scenes, so bug mode has none
    document.body.classList.add('bug-only');
    const zoom = +q.get('zoom') || 1;
    const fit = () => {
      const sx = innerWidth / 720, sy = innerHeight / 165;
      $('stage').style.transformOrigin = '0 0';
      $('stage').style.transform = q.has('stretch') ? `scale(${sx * zoom}, ${sy * zoom})` : `scale(${Math.min(sx, sy) * zoom})`;
    };
    addEventListener('resize', fit); fit();
  } else {
    // Full-frame mode (widget stretched over the whole camera): &zoom=1.4 sizes the bug, &x=40&y=30 moves it (px of a 1920x1080 frame).
    // &iphone=1: preset for an iPhone 15 Pro Max in landscape (19.5:9 widget): clear of the rounded corner / Dynamic Island side.
    // ponytail: preset numbers are a best guess without the phone in hand; &zoom/&x/&y still override them.
    const preset = q.has('iphone') ? { zoom: 1.15, x: 150, y: 40 } : {};
    const num = k => q.has(k) ? +q.get(k) || 0 : preset[k];
    fitStage(false, $('stage'));
    for (const mode of ['soon', 'break'])
      document.body.insertAdjacentHTML('beforeend', `<iframe class="scene" data-scene="${mode}" src="screen.html?mode=${mode}" aria-hidden="true"></iframe>`);
    const w = $('wrap');
    if (num('x') !== undefined) w.style.left = num('x') + 'px';
    if (num('y') !== undefined) w.style.top = num('y') + 'px';
    if (num('zoom')) w.style.scale = num('zoom');
    w.style.transformOrigin = 'top left';
  }
  onLive(render);
</script>
</body>
</html>
